[package]
name = "work-device"
version = "0.0.0"
edition = "2021"
publish = false
description = "Work R0b device-side Broker (M3). Authority: docs/work/design/work-r0b-device-design-2026-10-30.md"

[dependencies]
sha2 = "0.10"
p256 = { version = "0.13", features = ["ecdsa", "jwk"] }
base64ct = { version = "1", features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand_core = { version = "0.6", features = ["getrandom"] }
aes-gcm = "0.10"
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.32", features = ["bundled"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Security_Cryptography", "Win32_Foundation"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"