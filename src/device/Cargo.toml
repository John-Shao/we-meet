[package]
name = "work-device"
version = "0.0.0"
edition = "2021"
publish = false
description = "Work R0b device-side Broker (M3). Authority: docs/work/design/work-r0b-device-design-2026-10-30.md"

[dependencies]
sha2 = "0.10"
p256 = { version = "0.13", features = ["ecdsa", "jwk"] }
base64ct = { version = "1", features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_jcs = "0.1"
rand_core = { version = "0.6", features = ["getrandom"] }
aes-gcm = "0.10"
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.32", features = ["bundled"] }
tonic = { version = "0.13", default-features = false, features = ["codegen", "channel", "transport"] }
tokio-native-tls = "0.3.1"
native-tls = { version = "0.2.18", features = ["alpn", "vendored"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util"] }
http = "1.5.0"
bytes = "1.12.1"
futures-util = "0.3.34"
tower-service = "0.3.3"
hyper-util = { version = "0.1.21", features = ["tokio"] }

[target.'cfg(windows)'.dependencies]
schannel = "0.1.30"
windows = { version = "0.58", features = ["Win32_Security_Cryptography", "Win32_Foundation", "Win32_System_Pipes", "Win32_Security", "Win32_Security_Isolation", "Win32_System_Threading", "Win32_System_RemoteDesktop", "Win32_System_JobObjects", "Win32_Storage_FileSystem", "Win32_System_IO"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[dev-dependencies]
http-body-util = "0.1.5"
