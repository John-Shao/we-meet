appId: online.we-meet.desktop
productName: We-Meet
# Reuse the exact Electron binary installed by npm ci; avoid a second download.
electronDist: node_modules/electron/dist
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - '!dist/**/*.map'
  - package.json
protocols:
  - name: We-Meet Desktop Login
    schemes:
      - online.we-meet.desktop
extraResources:
  - from: .agent-runtime
    to: local-agent
    filter:
      - '0.3.1/**/*'
win:
  target: nsis
  # Agent payloads are authenticated by the pinned manifest / detached signature.
  # Re-signing them after manifest generation would invalidate their hashes.
  signExts:
    - '!python.exe'
    - '!pythonw.exe'
    - '!work-agent-local.exe'
    - '!deepseek-harness-sdk-runtime-win-x64-rg.exe'
    - '!deepseek-harness-sdk-runtime-win-x64.exe'
    - '!dsh.exe'
  artifactName: ${productName}-${version}-setup.${ext}
nsis:
  oneClick: true
  allowToChangeInstallationDirectory: false
  runAfterFinish: false
  deleteAppDataOnUninstall: false
mac:
  target: dmg
  category: public.app-category.business
  artifactName: ${productName}-${version}.${ext}
# 签名/公证（后续）：
#   win  — EV 证书；mac — Apple Developer + notarize（CSC_LINK / APPLE_ID 等环境变量）
#   自动更新（后续）：electron-updater + 自建/对象存储 feed（publish 字段）
