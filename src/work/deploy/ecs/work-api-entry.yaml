# Work-side entry for the systemd-hosted work-api (applied on the Work ECS
# k3s cluster). work-api listens on 0.0.0.0:8080; public 8080 stays closed and
# only the k3s ingress reaches it. Host header is preserved by the meet ingress.
apiVersion: v1
kind: Service
metadata:
  name: work-api
  namespace: work
spec:
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: v1
kind: Endpoints
metadata:
  name: work-api
  namespace: work
subsets:
  - addresses:
      - ip: 172.16.0.7
    ports:
      - name: http
        port: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: work-api
  namespace: work
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - host: meet.we-meet.online
      http:
        paths:
          - path: /work/v1
            pathType: Prefix
            backend:
              service:
                name: work-api
                port:
                  number: 80
