{{- if .Values.workAgent.enabled -}}
{{- include "work-agent-k8s.validate" . -}}
{{- $a := .Values.workAgent -}}
{{- if not $a.persistence.existingClaim }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $a.fullname }}-state
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  {{- if $a.persistence.storageClass }}
  storageClassName: {{ $a.persistence.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ $a.persistence.size }}
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $a.fullname }}
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  selector:
    {{- include "work-agent-k8s.labels" . | nindent 4 }}
  ports:
    - {name: https, port: {{ $a.port }}, targetPort: https}
    - {name: broker, port: {{ $a.brokerPort }}, targetPort: broker}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $a.fullname }}
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels:
      {{- include "work-agent-k8s.labels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "work-agent-k8s.labels" . | nindent 8 }}
      annotations:
        work-agent/credentials-revision: {{ $a.credentialsRevision | quote }}
    spec:
      serviceAccountName: {{ $a.fullname }}
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      {{- with $a.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: gateway
          image: {{ printf "%s@%s" $a.image.repository $a.image.digest | quote }}
          imagePullPolicy: IfNotPresent
          args:
            - --execution
            - kubernetes
            - --engine
            - {{ $a.engine | quote }}
            - --provider
            - {{ $a.provider | quote }}
            - --model
            - {{ $a.model | quote }}
            - --base-url
            - {{ $a.baseUrl | quote }}
            - --state-dir
            - {{ $a.runtime.stateDirectory | quote }}
            - --image
            - {{ $a.runtime.workerImage | quote }}
            - --task-namespace
            - {{ $a.tasks.namespace | quote }}
            - --task-service-account
            - {{ $a.tasks.serviceAccount | quote }}
            - --task-ca-config-map
            - {{ $a.tasks.caConfigMap | quote }}
            {{- range $secret := $a.tasks.imagePullSecrets }}
            - --task-image-pull-secret
            - {{ $secret.name | quote }}
            {{- end }}
            - --broker-url
            - {{ printf "https://%s.%s.svc.cluster.local:%v" $a.fullname .Release.Namespace $a.brokerPort | quote }}
            - --broker-port
            - {{ $a.brokerPort | quote }}
            - --host
            - "0.0.0.0"
            - --port
            - {{ $a.port | quote }}
            - --tls-cert
            - /etc/work-agent/tls/tls.crt
            - --tls-key
            - /etc/work-agent/tls/tls.key
          env:
            - name: WORK_AGENT_TOKEN
              valueFrom:
                secretKeyRef: {name: {{ $a.secrets.gatewaySecret }}, key: WORK_AGENT_TOKEN}
            {{- if ne $a.engine "fixture" }}
            - name: {{ ternary "DASHSCOPE_API_KEY" "DEEPSEEK_API_KEY" (eq $a.provider "qwen") }}
              valueFrom:
                secretKeyRef:
                  name: {{ $a.secrets.providerSecret }}
                  key: {{ ternary "DASHSCOPE_API_KEY" "DEEPSEEK_API_KEY" (eq $a.provider "qwen") }}
            {{- end }}
          ports:
            - {name: https, containerPort: {{ $a.port }}}
            - {name: broker, containerPort: {{ $a.brokerPort }}}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          startupProbe:
            exec: &probe
              command:
                - python
                - -m
                - work_agent.health
                - --port
                - {{ $a.port | quote }}
                - --server-name
                - {{ printf "%s.%s.svc.cluster.local" $a.fullname .Release.Namespace | quote }}
                - --ca-file
                - /etc/work-agent/tls/ca.crt
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 24
          readinessProbe:
            exec: *probe
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            {{- toYaml $a.resources | nindent 12 }}
          volumeMounts:
            - {name: state, mountPath: {{ $a.runtime.stateDirectory | quote }}}
            - {name: tmp, mountPath: /tmp}
            - {name: tls, mountPath: /etc/work-agent/tls, readOnly: true}
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-state" $a.fullname) $a.persistence.existingClaim }}
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
        - name: tls
          secret:
            secretName: {{ $a.tls.existingSecret }}
            defaultMode: 0440
{{- end }}
