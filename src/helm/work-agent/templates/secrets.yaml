{{- if and .Values.workAgent.enabled .Values.workAgent.secrets.create -}}
{{- include "work-agent.validate" . -}}
{{- $secrets := .Values.workAgent.secrets -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secrets.gatewaySecret }}
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  {{- if not $secrets.providerSecret }}
  {{ if eq .Values.workAgent.provider "qwen" }}DASHSCOPE_API_KEY: {{ $secrets.qwenApiKey | quote }}
  {{ else }}DEEPSEEK_API_KEY: {{ $secrets.deepseekApiKey | quote }}
  {{ end }}
  {{- end }}
  WORK_AGENT_TOKEN: {{ $secrets.gatewayToken | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secrets.clientSecret }}
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  WORK_AGENT_TOKEN: {{ $secrets.gatewayToken | quote }}
{{- end }}
