{{- if .Values.workAgent.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "work-agent.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "work-agent.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "work-agent.labels" . | nindent 4 }}
  ports:
    - name: https
      port: {{ .Values.workAgent.port }}
      targetPort: https
{{- end }}
