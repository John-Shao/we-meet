{{- if .Values.meetingAIWorkers.credentialsFromExistingEnv }}
{{- $name := required "meetingAIWorkers.credentialsSecret is required" .Values.meetingAIWorkers.credentialsSecret }}
{{- $key := required "AI rollout requires agentAIAssistant.envVars.DASHSCOPE_API_KEY in the secret values file" .Values.agentAIAssistant.envVars.DASHSCOPE_API_KEY }}
{{- $token := required "AI rollout requires backend.envVars.AGENT_INTERNAL_API_TOKEN in the secret values file" .Values.backend.envVars.AGENT_INTERNAL_API_TOKEN }}
{{- $livekitKey := required "AI rollout requires agentSubtitles.envVars.LIVEKIT_API_KEY" .Values.agentSubtitles.envVars.LIVEKIT_API_KEY }}
{{- $livekitSecret := required "AI rollout requires agentSubtitles.envVars.LIVEKIT_API_SECRET in the secret values file" .Values.agentSubtitles.envVars.LIVEKIT_API_SECRET }}
{{- $workspace := .Values.agentAIAssistant.envVars.DASHSCOPE_WORKSPACE_ID | default "" }}
{{- $asrEnabled := or (index .Values.meetingAIWorkers.workers "capture-asr").enabled (index .Values.meetingAIWorkers.workers "capture-live-asr").enabled (eq (.Values.agentSubtitles.envVars.STT_PROVIDER | default "") "qwen") }}
{{- if $asrEnabled }}
{{- $workspace = required "Qwen ASR requires agentAIAssistant.envVars.DASHSCOPE_WORKSPACE_ID in the secret values file" $workspace }}
{{- if not (kindIs "string" $workspace) }}
{{- fail "DASHSCOPE_WORKSPACE_ID must be a string" }}
{{- end }}
{{- if not (regexMatch "^[A-Za-z0-9-]+$" $workspace) }}
{{- fail "DASHSCOPE_WORKSPACE_ID must contain only letters, digits and hyphens" }}
{{- end }}
{{- end }}
{{- range $value := list $key $token $livekitKey $livekitSecret }}
{{- if not (kindIs "string" $value) }}
{{- fail "credentialsFromExistingEnv requires string values; use an existing credentialsSecret for external Secret references" }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace | quote }}
  annotations:
    # Migration hooks inherit backend env and need this Secret on first rollout.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
type: Opaque
stringData:
  DASHSCOPE_API_KEY: {{ $key | quote }}
  AGENT_INTERNAL_API_TOKEN: {{ $token | quote }}
  LIVEKIT_API_KEY: {{ $livekitKey | quote }}
  LIVEKIT_API_SECRET: {{ $livekitSecret | quote }}
  {{- with $workspace }}
  DASHSCOPE_WORKSPACE_ID: {{ . | quote }}
  {{- end }}
{{- end }}
