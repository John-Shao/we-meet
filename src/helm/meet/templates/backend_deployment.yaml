{{- $pools := list (dict "component" "backend" "name" (include "meet.backend.fullname" .) "config" .Values.backend) -}}
{{- if .Values.aiBackend.enabled -}}
{{- $ai := mergeOverwrite (deepCopy .Values.backend) (deepCopy .Values.aiBackend) -}}
{{/* Both pools are one release artifact. Do not allow a stale separate image tag. */}}
{{- $_ := set $ai "image" (.Values.backend.image | default dict) -}}
{{/* AI HTTP does not use the backend PVCs. Explicit extraVolumes still inherit. */}}
{{- $_ := set $ai "persistence" dict -}}
{{- $pools = append $pools (dict "component" "backend-ai" "name" (printf "%s-ai" (include "meet.backend.fullname" .)) "config" $ai) -}}
{{- end -}}
{{- range $pool := $pools }}
{{- with $ }}
{{- $backend := $pool.config -}}
{{- $envVars := include "meet.common.env" (list . $backend) -}}
{{- $fullName := $pool.name -}}
{{- $component := $pool.component }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullName }}
  annotations:
     {{- with $backend.dpAnnotations }}
     {{- toYaml . | nindent 4 }}
     {{- end }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "meet.common.labels" (list . $component) | nindent 4 }}
spec:
  replicas: {{ $backend.replicas }}
  selector:
    matchLabels:
      {{- include "meet.common.selectorLabels" (list . $component) | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- with $backend.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "meet.common.selectorLabels" (list . $component) | nindent 8 }}
    spec:
      {{- if $.Values.image.credentials }}
      imagePullSecrets:
        - name: {{ include "meet.secret.dockerconfigjson.name" (dict "fullname" (include "meet.fullname" .) "imageCredentials" $.Values.image.credentials) }}
      {{- end }}
      shareProcessNamespace: {{ $backend.shareProcessNamespace }}
      {{- with $backend.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        {{- with $backend.sidecars }}
          {{- toYaml . | nindent 8 }}
        {{- end }}
        - name: {{ .Chart.Name }}
          image: "{{ include "meet.image.reference" (dict "image" $backend.image "fallback" .Values.image) }}"
          imagePullPolicy: {{ ($backend.image | default dict).pullPolicy | default .Values.image.pullPolicy }}
          {{- with $backend.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $backend.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            {{- if $envVars }}
            {{- $envVars | indent 12 }}
            {{- end }}
          {{- with $backend.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ $backend.service.targetPort }}
              protocol: TCP
          {{- if $backend.probes.liveness }}
          livenessProbe:
            {{- include "meet.probes.abstract" (merge $backend.probes.liveness (dict "targetPort" $backend.service.targetPort )) | nindent 12 }}
          {{- end }}
          {{- if $backend.probes.readiness }}
          readinessProbe:
            {{- include "meet.probes.abstract" (merge $backend.probes.readiness (dict "targetPort" $backend.service.targetPort )) | nindent 12 }}
          {{- end }}
          {{- if $backend.probes.startup }}
          startupProbe:
            {{- include "meet.probes.abstract" (merge $backend.probes.startup (dict "targetPort" $backend.service.targetPort )) | nindent 12 }}
          {{- end }}
          {{- with $backend.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            {{- range $index, $value := .Values.mountFiles }}
            - name: "files-{{ $index }}"
              mountPath: {{ $value.path }}
              subPath: content
            {{- end }}
            {{- range $name, $volume := $backend.persistence }}
            - name: "{{ $name }}"
              mountPath: "{{ $volume.mountPath }}"
            {{- end }}
            {{- range $backend.extraVolumeMounts }}
            - name: {{ .name }}
              mountPath: {{ .mountPath }}
              subPath: {{ .subPath | default "" }}
              readOnly: {{ .readOnly }}
            {{- end }}
      {{- with $backend.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $backend.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $backend.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        {{- range $index, $value := .Values.mountFiles }}
        - name: "files-{{ $index }}"
          configMap:
            name: "{{ include "meet.fullname" $ }}-files-{{ $index }}"
        {{- end }}
        {{- range $name, $volume := $backend.persistence }}
        - name: "{{ $name }}"
          {{- if eq $volume.type "emptyDir" }}
          emptyDir: {}
          {{- else }}
          persistentVolumeClaim:
            claimName: "{{ $fullName }}-{{ $name }}"
          {{- end }}
        {{- end }}
        {{- range $backend.extraVolumes }}
        - name: {{ .name }}
          {{- if .existingClaim }}
          persistentVolumeClaim:
            claimName: {{ .existingClaim }}
          {{- else if .hostPath }}
          hostPath:
            {{ toYaml .hostPath | nindent 12 }}
          {{- else if .csi }}
          csi:
            {{- toYaml .csi | nindent 12 }}
          {{- else if .configMap }}
          configMap:
            {{- toYaml .configMap | nindent 12 }}
          {{- else if .emptyDir }}
          emptyDir:
            {{- toYaml .emptyDir | nindent 12 }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- end }}
---
{{ if $backend.pdb.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $fullName }}
  namespace: {{ .Release.Namespace | quote }}
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      {{- include "meet.common.selectorLabels" (list . $component) | nindent 6 }}
{{ end }}

{{- end }}
{{- end }}
