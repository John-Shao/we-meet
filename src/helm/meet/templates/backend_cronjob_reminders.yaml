{{- if .Values.backend.reminders.enabled }}
{{- $envVars := include "meet.common.env" (list . .Values.backend) -}}
{{- $fullName := include "meet.backend.fullname" . -}}
{{- $component := "backend-reminders" -}}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $fullName }}-reminders
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "meet.common.labels" (list . $component) | nindent 4 }}
spec:
  # Scan due calendar events and push source-conversation IM reminders.
  # Idempotent (CalendarEvent.reminder_pushed_at), so re-runs are safe.
  schedule: {{ .Values.backend.reminders.schedule | quote }}
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: {{ .Values.backend.jobs.ttlSecondsAfterFinished }}
      backoffLimit: 0
      template:
        metadata:
          labels:
            {{- include "meet.common.selectorLabels" (list . $component) | nindent 12 }}
        spec:
          {{- if $.Values.image.credentials }}
          imagePullSecrets:
            - name: {{ include "meet.secret.dockerconfigjson.name" (dict "fullname" (include "meet.fullname" .) "imageCredentials" $.Values.image.credentials) }}
          {{- end }}
          {{- with .Values.backend.podSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          containers:
            - name: {{ .Chart.Name }}
              image: "{{ (.Values.backend.image | default dict).repository | default .Values.image.repository }}:{{ (.Values.backend.image | default dict).tag | default .Values.image.tag }}"
              imagePullPolicy: {{ (.Values.backend.image | default dict).pullPolicy | default .Values.image.pullPolicy }}
              command:
                {{- toYaml .Values.backend.reminders.command | nindent 16 }}
              env:
                {{- if $envVars }}
                {{- $envVars | indent 16 }}
                {{- end }}
              {{- with .Values.backend.securityContext }}
              securityContext:
                {{- toYaml . | nindent 16 }}
              {{- end }}
              {{- with .Values.backend.resources }}
              resources:
                {{- toYaml . | nindent 16 }}
              {{- end }}
              volumeMounts:
                {{- range $index, $value := .Values.mountFiles }}
                - name: "files-{{ $index }}"
                  mountPath: {{ $value.path }}
                  subPath: content
                {{- end }}
                {{- range .Values.backend.extraVolumeMounts }}
                - name: {{ .name }}
                  mountPath: {{ .mountPath }}
                  subPath: {{ .subPath | default "" }}
                  readOnly: {{ .readOnly }}
                {{- end }}
          {{- with .Values.backend.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.backend.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          restartPolicy: Never
          volumes:
            {{- range $index, $value := .Values.mountFiles }}
            - name: "files-{{ $index }}"
              configMap:
                name: "{{ include "meet.fullname" $ }}-files-{{ $index }}"
            {{- end }}
            {{- range .Values.backend.extraVolumes }}
            - name: {{ .name }}
              {{- if .existingClaim }}
              persistentVolumeClaim:
                claimName: {{ .existingClaim }}
              {{- else if .configMap }}
              configMap:
                {{- toYaml .configMap | nindent 16 }}
              {{- else if .emptyDir }}
              emptyDir:
                {{- toYaml .emptyDir | nindent 16 }}
              {{- else }}
              emptyDir: {}
              {{- end }}
            {{- end }}
{{- end }}
