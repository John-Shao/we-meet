# Production values for the meet helm chart, targeting:
#   - 4C8G Aliyun ECS in cn-shenzhen, single-node K3s
#   - Keycloak running on a separate 2C2G ECS (id.we-meet.online)
#   - Aliyun OSS as the S3-compatible media backend
#   - Alibaba Cloud Bailian Qwen for meeting transcription, summaries and QA
#   - Recording disabled (待第二阶段加 livekit-egress + 第二台 ECS)
#   - Subtitles/transcription disabled (current upstream agents code only supports
#     deepgram/kyutai; 火山豆包 STT 需要后续移植自定义 plugin)
#
# Render with plain `helm install` (NOT helmfile — helmfile is dev-only):
#   helm upgrade --install meet ./src/helm/meet \
#     -n meet --create-namespace \
#     -f src/helm/env.d/aliyun-prod/values.meet.yaml \
#     -f src/helm/env.d/aliyun-prod/values.secrets.yaml
#
# values.secrets.yaml is gitignored — copy values.secrets.yaml.dist and fill in.

image:
  repository: jusi-cn-guangzhou.cr.volces.com/we-meet/meet-backend
  pullPolicy: Always
  tag: "latest"
  credentials:
    name: meet-dockerconfig
    registry: jusi-cn-guangzhou.cr.volces.com
    # username / password come from values.secrets.yaml

backend:
  replicas: 1

  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      memory: 1Gi

  envVars:
    # The 1 GiB API pod also handles PCM uploads and recording-page polling.
    # Leave headroom for S3 clients and stagger graceful worker recycling.
    GUNICORN_WORKERS: "2"
    GUNICORN_MAX_REQUESTS: "500"
    GUNICORN_MAX_REQUESTS_JITTER: "50"
    DJANGO_CONFIGURATION: Production
    DJANGO_SETTINGS_MODULE: meet.settings
    # meet-backend 是 K8s service DNS — agent worker 在集群内通过它写
    # transcripts，必须在 ALLOWED_HOSTS 中允许，否则 Django 返回 400。
    DJANGO_ALLOWED_HOSTS: meet.we-meet.online,meet-backend
    DJANGO_CSRF_TRUSTED_ORIGINS: https://meet.we-meet.online
    DJANGO_SILENCED_SYSTEM_CHECKS: security.W004,security.W008
    # DJANGO_SECRET_KEY 来自 values.secrets.yaml

    # Email — 备案完成前可先用 Aliyun 邮件推送，或暂时填占位等后续再开
    DJANGO_EMAIL_HOST: smtpdm.aliyun.com
    DJANGO_EMAIL_PORT: 465
    DJANGO_EMAIL_USE_SSL: "True"
    DJANGO_EMAIL_FROM: noreply@we-meet.online
    DJANGO_EMAIL_BRAND_NAME: We-Meet
    DJANGO_EMAIL_DOMAIN: meet.we-meet.online
    DJANGO_EMAIL_APP_BASE_URL: https://meet.we-meet.online
    # Public application origin used by task/summary cards to build in-product
    # navigation actions. backend.envVars are inherited by celery-backend.
    APPLICATION_BASE_URL: https://meet.we-meet.online
    EMAIL_SUPPORT_EMAIL: support@we-meet.online
    EMAIL_LOGO_IMG: https://meet.we-meet.online/assets/logo-suite-numerique.png

    # OIDC → Keycloak on 2C2G ECS (cross-VPC over public HTTPS)
    OIDC_OP_JWKS_ENDPOINT: https://id.we-meet.online/realms/meet/protocol/openid-connect/certs
    OIDC_OP_AUTHORIZATION_ENDPOINT: https://id.we-meet.online/realms/meet/protocol/openid-connect/auth
    OIDC_OP_TOKEN_ENDPOINT: https://id.we-meet.online/realms/meet/protocol/openid-connect/token
    OIDC_OP_USER_ENDPOINT: https://id.we-meet.online/realms/meet/protocol/openid-connect/userinfo
    OIDC_OP_LOGOUT_ENDPOINT: https://id.we-meet.online/realms/meet/protocol/openid-connect/logout
    OIDC_RP_SIGN_ALGO: RS256
    OIDC_RP_SCOPES: "openid email"
    OIDC_REDIRECT_ALLOWED_HOSTS: '["https://meet.we-meet.online"]'
    OIDC_REDIRECT_REQUIRE_HTTPS: "True"
    OIDC_VERIFY_SSL: "True"
    LOGIN_REDIRECT_URL: https://meet.we-meet.online
    LOGIN_REDIRECT_URL_FAILURE: https://meet.we-meet.online
    LOGOUT_REDIRECT_URL: https://meet.we-meet.online
    # OIDC_RP_CLIENT_ID / OIDC_RP_CLIENT_SECRET 来自 values.secrets.yaml

    # Database — in-cluster postgres
    DB_HOST: postgresql
    DB_PORT: 5432
    DB_NAME: meet
    DB_USER: meet
    # DB_PASSWORD 来自 values.secrets.yaml

    # Redis — in-cluster redis (bitnami chart default service name)
    # REDIS_URL 来自 values.secrets.yaml (含密码)
    # CELERY_BROKER_URL 同上

    # Static files served by whitenoise
    STORAGES_STATICFILES_BACKEND: whitenoise.storage.CompressedManifestStaticFilesStorage

    # LiveKit — in-cluster, exposed via livekit.we-meet.online
    LIVEKIT_API_URL: https://livekit.we-meet.online/
    LIVEKIT_API_KEY: meet
    # LIVEKIT_API_SECRET 来自 values.secrets.yaml
    LIVEKIT_VERIFY_SSL: "True"
    LIVEKIT_FORCE_WSS_PROTOCOL: "True"
    LIVEKIT_WEBHOOK_EVENTS_FILTER_REGEX: "[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}"
    ALLOW_UNREGISTERED_ROOMS: "False"

    # Storage — 阿里云 OSS (S3 兼容模式), 华南1(深圳), 与 ECS 同区域同账号.
    # 主桶 we-meet-video (recordings/metadata); 头像/封面见下方 Mobile app 块.
    AWS_S3_ENDPOINT_URL: https://oss-cn-shenzhen.aliyuncs.com
    AWS_S3_REGION_NAME: cn-shenzhen
    AWS_STORAGE_BUCKET_NAME_VIDEO: we-meet-video
    AWS_STORAGE_BUCKET_NAME_TASK_ATTACHMENT: we-task-attachment
    AWS_S3_SIGNATURE_VERSION: s3v4
    AWS_S3_ADDRESSING_STYLE: virtual
    # AWS_S3_ACCESS_KEY_ID / AWS_S3_SECRET_ACCESS_KEY 来自 values.secrets.yaml
    MEDIA_BASE_URL: https://meet.we-meet.online

    # Task attachments use the generic /api/v1.0/files/ upload handshake.
    # Production defaults this feature off, which deliberately returns 404,
    # so keep the switch explicit alongside the OSS configuration.
    FILE_UPLOAD_ENABLED: "True"

    # --- Mobile app (移动端 OTP 登录 + 个人资料) ---
    # OTP 登录经 meet-service 机密客户端走 Keycloak Token Exchange.
    MOBILE_AUTH_SERVICE_CLIENT_ID: meet-service
    # MOBILE_AUTH_SERVICE_CLIENT_SECRET 来自 values.secrets.yaml
    # 头像 / 封面专用桶 (阿里云 OSS, 与主桶同账号 / endpoint).
    # 两个桶保持「私有」(阻止公共访问开启) —— 后端用预签名 GET URL 下发图片.
    AWS_STORAGE_BUCKET_NAME_AVATAR: we-meet-avatar
    AWS_STORAGE_BUCKET_NAME_COVER: we-meet-cover
    # IM 聊天图片 / 文件 / 语音专用桶 (P7, 私有, 预签名 GET 下发). settings.py
    # 默认值已是这些桶名, 此处显式声明以防默认漂移并便于运维核对.
    AWS_STORAGE_BUCKET_NAME_CHAT_IMAGE: we-chat-image
    AWS_STORAGE_BUCKET_NAME_CHAT_FILE: we-chat-doc
    AWS_STORAGE_BUCKET_NAME_CHAT_AUDIO: we-chat-audio
    # 火山引擎短信 — 复用 jusi (巨思人工智能) 的短信账号 / 签名 / 模板.
    # AK / SK 属火山引擎账号密钥, 见 values.secrets.yaml.
    VOLC_SMS_ACCOUNT: "8880e180"
    VOLC_SMS_SIGN: "巨思人工智能"
    VOLC_SMS_TEMPLATE_ID: "S1T_1y2p1bc526ebm"
    # 联调用 demo 账号: 列出的手机号不发真实短信, 验证码固定为 DEMO_OTP.
    # ⚠️ 仅联调期启用, 正式对外前务必删除 (否则等于登录后门).
    MOBILE_AUTH_DEMO_PHONES: "13800000000,13800000001,13800000002,13800000003,13800000004,13800000005,13800000006,13800000007,13800000008,13800000009"
    MOBILE_AUTH_DEMO_OTP: "123456"

    # Recording — 第一阶段关闭
    RECORDING_ENABLE: "True"
    RECORDING_STORAGE_EVENT_ENABLE: "False"

    # Summary — 启用，调本地 meet-summary service
    SUMMARY_SERVICE_ENDPOINT: http://meet-summary:80/api/v1/tasks/
    # SUMMARY_SERVICE_API_TOKEN 来自 values.secrets.yaml

    # All meeting text generation uses MEETING_SUMMARY_MODEL / DASHSCOPE_API_KEY.
    # Old vectors remain keyword-searchable until an explicit Qwen reindex.
    QWEN_EMBEDDING_MODEL: "text-embedding-v4"

    # Realtime subtitles use Qwen ASR.
    ROOM_SUBTITLE_ENABLED: "True"

    # Telephony / external app / addons — 默认全关
    ROOM_TELEPHONY_ENABLED: "False"
    EXTERNAL_API_ENABLED: "False"
    ADDONS_ENABLED: "False"
    METADATA_COLLECTOR_ENABLED: "True"

    # Meeting AI assistant (Qwen-Omni)
    # Agent worker registered under AI_AGENT_NAME; provider routing happens
    # via LiveKit job metadata. See agentAIAssistant block below.
    AI_AGENT_NAME: "ai-agent"
    AI_AGENT_ENABLED: "True"

    # Sprint 2.2 follow-up #8: route generate_meeting_summary through
    # the meet-celery-backend worker (off-thread) rather than running it
    # synchronously in the gunicorn worker that handles the LiveKit
    # room_finished webhook.
    CELERY_ENABLED: "True"
    # Meeting AI rollout: shared by API, celeryBackend and celeryBeat.
    MEETING_RECORDS_ENABLED: "True"
    # Batch 41 verified the lifecycle columns and bd16ac487 backend/worker rollout.
    # Reversible trash only; no automatic expiry or permanent deletion.
    MEETING_RECORD_TRASH_ENABLED: "True"
    # Separate rollout after migration and all upload adopters/workers are updated.
    MEETING_RECORD_PURGE_ENABLED: "False"
    MEETING_TRANSCRIPT_DELIVERY_ENABLED: "True"
    MEETING_CAPTURE_PROTOCOL_ENABLED: "True"
    MEETING_CAPTURE_AUDIO_ENABLED: "True"
    # Import original audio/video and transcribe asynchronously with Celery.
    MEETING_FILE_ASR_ENABLED: "True"
    # Multipart ceiling: bytes spool to app disk, so this stays bounded.
    MEETING_FILE_ASR_MAX_BYTES: "104857600"
    # Direct (presigned) uploads: client PUTs straight to object storage, so the
    # 100 MiB app-disk ceiling above does not apply and GB-scale imports become
    # possible. Both clients now ship the two-step flow (Web and Android), and
    # imports above 100 MiB use the resumable multipart endpoints instead of one
    # all-or-nothing PUT, so `upload-url/` + `upload-complete/` are no longer the
    # only path a large file can take.
    #
    # Requires the bucket's CORS rule to allow the web origin, PUT/POST and
    # Content-Type, and to EXPOSE THE ETag RESPONSE HEADER - without ETag
    # exposure a browser cannot complete a multipart upload at all. Confirmed
    # present for we-meet-video (Aliyun OSS, Shenzhen). Android is unaffected:
    # OkHttp reads any response header.
    MEETING_FILE_DIRECT_UPLOAD_ENABLED: "True"
    MEETING_FILE_DIRECT_UPLOAD_MAX_BYTES: "6442450944"
    QWEN_FILE_ASR_REGION: "cn-beijing"
    MEETING_CAPTURE_ASR_ENABLED: "True"
    MEETING_CAPTURE_LIVE_ASR_ENABLED: "True"
    MEETING_CAPTURE_TEXT_ONLY_ENABLED: "True"
    MEETING_ONLINE_CAPTURE_ENABLED: "True"
    MEETING_CLOUD_RECORDING_ENABLED: "True"
    MEETING_VERSIONED_SUMMARY_ENABLED: "True"
    MEETING_SUMMARY_REQUESTS_ENABLED: "True"
    MEETING_STAGED_SUMMARY_ENABLED: "True"
    MEETING_SUMMARY_AUTOMATION_ENABLED: "True"
    MEETING_SUMMARY_CHUNKING_ENABLED: "True"
    MEETING_CAPTURE_SUMMARY_ENABLED: "True"
    MEETING_CAPTURE_STAGED_SUMMARY_ENABLED: "True"
    MEETING_SUMMARY_REVIEW_ENABLED: "True"
    MEETING_SUMMARY_TASKS_ENABLED: "True"
    MEETING_RECORD_QA_ENABLED: "True"
    MEETING_SUMMARY_EXPORT_ENABLED: "True"
    MEETING_SUMMARY_NOTIFICATIONS_ENABLED: "True"
    MEETING_SUMMARY_SHARING_ENABLED: "True"
    MEETING_TRANSLATION_ENABLED: "True"
    MEETING_INTERPRETATION_ENABLED: "True"
    MEETING_TRANSLATION_ARCHIVE_ENABLED: "True"
    MEETING_CAPTURE_TRANSLATION_ENABLED: "True"
    MEETING_CAPTURE_TRANSLATION_URL: "wss://meet.we-meet.online/capture-translation"
    MEETING_CAPTURE_TRANSLATION_REGION: "cn-beijing"
    ROOM_SUBTITLE_AGENT_NAME: "multi-user-transcriber"
    ROOM_TRANSLATION_AGENT_NAME: "meeting-translation"
    ROOM_INTERPRETATION_AGENT_NAME: "meeting-interpretation"
    QWEN_ASR_MODEL: "qwen-audio-3.0-asr-flash-streaming"
    QWEN_ASR_REGION: "cn-beijing"
    MEETING_SUMMARY_MODEL: "qwen3.8-flash"
    MEETING_SUMMARY_BASE_URL: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    DASHSCOPE_API_KEY:
      secretKeyRef:
        name: meet-ai-credentials
        key: DASHSCOPE_API_KEY

    # Calendar P0/P1/P2 have completed production rollout.  Keep the unified
    # list enabled so the secondary sidebar exposes Add/Managed/Subscribed;
    # sharing and export remain independently gated for emergency rollback.
    UNIFIED_CALENDAR_ENABLED: "True"
    CALENDAR_SHARING_ENABLED: "True"
    CALENDAR_EXPORT_ENABLED: "True"

    # ─── jusi-light-im (IM bridge — P5/P6) ───────────────────────────────
    # Independent 4C4G ECS at im.we-meet.online running K3s + jusi-light-im +
    # systemd PG/Redis + Caddy. See John-Shao/jusi-light-im for deploy runbook.
    #
    # backend.envVars are merged into celery-backend's env (see
    # celery_backend_deployment.yaml `mergeOverwrite`), so the
    # generate_meeting_summary worker also reads JUSI_IM_* and can push the
    # `📋 会议纪要已生成` system message after summarising.
    JUSI_IM_API_URL: https://im.we-meet.online
    JUSI_IM_WS_URL: wss://im.we-meet.online/v1/ws
    JUSI_IM_TOKEN_TTL: "86400"
    JUSI_IM_TIMEOUT_S: "5"
    # JUSI_IM_ADMIN_HMAC_SECRET 来自 values.secrets.yaml (must match the
    # ADMIN_HMAC_SECRET seeded on the jusi-light-im ECS — see
    # docs/runbooks/p6-deploy.md §3 in the jusi-light-im repo).

    # ─── 群机器人 (自定义 webhook 机器人, 对标飞书) ───────────────────────
    # webhook 地址由这个 origin + /api/bot/v1/hook/<token> 拼成。它会被贴进
    # 第三方的 CI 配置, 所以必须是外部可达的域名 —— 不设会回退
    # DJANGO_EMAIL_APP_BASE_URL(当前恰好同值), 但那是巧合不是约定, 显式写死。
    #
    # 无需 ingress 改动: 主 ingress 的 /api/ Prefix 已经转给 backend。
    # 该端点无 DRF 鉴权, path 里的 token 即凭据; 每个机器人的 token / 签名密钥
    # 在建的时候入库生成, 故这里不需要新 secret。
    #
    # ⚠️ 上线顺序: jusi-light-im 的 P23(members.role='bot') 必须先上, 否则
    # add_bots 被老版本忽略 → 机器人不入群 → 消息 sender 被静默改写成全零
    # SYSTEM(HTTP 仍 200, 无报错), 群里只会看到居中灰条。
    BOT_WEBHOOK_BASE_URL: https://meet.we-meet.online
    # 限流三档(bot_webhook 100/min、bot_webhook_burst 5/s、bot_webhook_ip
    # 600/min)与每群机器人数上限(BOT_MAX_PER_CONVERSATION=10)都有默认值,
    # 被刷时再用对应环境变量热调, 平时不用在这里写死。

    # ─── P3 协作文档 (La Suite Docs / 妙记落 Doc) ─────────────────────────
    # Summary SUCCESS → docs_client 建文档 → 存 MeetingDoc → doc 链接发进 IM。
    # 与 JUSI_IM 一样在 generate_meeting_summary 的 celery 里跑（envVars 合并进
    # celery-backend），故 DOCS_* 放 backend.envVars 正好。DOCS_API_URL 留空则妙记
    # 落 Doc 静默 no-op（Docs 没起来不影响 meet）；它同时点亮前端「文档」导航入口。
    # 部署见 docs/installation/docs-server.md §六。
    DOCS_API_URL: https://docs.we-meet.online
    # DOCS_SERVER_TO_SERVER_TOKEN 来自 values.secrets.yaml，须与 Docs 独立机的
    # DJANGO_SERVER_TO_SERVER_API_TOKENS 逐字符一致（docs.values.yaml 里同一个 token）。

    # ─── P0 离线推送 (foundation §P0) ────────────────────────────────────
    # jusi-light-im p14 检测到会话全员离线 → 回调 /api/agent/push-hook/ →
    # 后端经个推透传下发. 机密 (IM_PUSH_WEBHOOK_SECRET / GETUI_*) 在
    # values.secrets.yaml. 此处仅放非机密开关:
    #   PUSH_CONTENT_VISIBLE=True  推送带发件人+正文预览
    #                        False 只推「你有一条新消息」(隐私/合规模式)
    PUSH_CONTENT_VISIBLE: "True"

    FRONTEND_USE_FRENCH_GOV_FOOTER: "False"
    FRONTEND_USE_PROCONNECT_BUTTON: "False"
    FRONTEND_SILENCE_LIVEKIT_DEBUG: "True"
    FRONTEND_IS_SILENT_LOGIN_ENABLED: "True"

  command:
    - "gunicorn"
    - "-c"
    - "/usr/local/etc/gunicorn/meet.py"
    - "meet.wsgi:application"

  migrate:
    command:
      - "/bin/sh"
      - "-c"
      - |
        python manage.py migrate --no-input
    restartPolicy: Never

  createsuperuser:
    command:
      - "/bin/sh"
      - "-c"
      - |
        python manage.py createsuperuser --email $DJANGO_SUPERUSER_EMAIL --password $DJANGO_SUPERUSER_PASSWORD || true
    restartPolicy: Never

  # 日程 + 任务提醒:每分钟扫描到期记录并幂等投递。
  # chart 默认 enabled:false;生产开启,schedule/command 继承 chart values。
  reminders:
    enabled: true
  docsProfileSync:
    enabled: true

frontend:
  replicas: 1

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

  image:
    repository: jusi-cn-guangzhou.cr.volces.com/we-meet/meet-frontend
    pullPolicy: Always
    tag: "latest"

  envVars:
    VITE_APP_TITLE: "We-Meet"
    VITE_PORT: 8080
    VITE_HOST: 0.0.0.0
    VITE_API_BASE_URL: https://meet.we-meet.online/

ingress:
  enabled: true
  className: nginx
  host: meet.we-meet.online
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # 100 MiB media plus multipart fields and headers.
    nginx.ingress.kubernetes.io/proxy-body-size: "101m"
    # Sprint 2.5 — disable response buffering so the SSE streams from
    # /rooms/.../ask-ai-stream/ and /users/me/ai/ask-stream/ reach the
    # browser chunk-by-chunk instead of being collected into one blob.
    # X-Accel-Buffering: no on the response handles the Django side;
    # this is the matching ingress-level guard for the typewriter UX.
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    # Long enough for a Doubao Pro stream (often 5-15s end-to-end) plus
    # generous margin so users don't get cut off mid-answer on slow links.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
  tls:
    enabled: true
    secretName: meet-tls
  # /keycloak-sms/ → backend（Keycloak phone-auth 插件的短信网关端点）。
  # 它是顶层路径（非 /api），主 ingress 默认只把 /api、/external-api 转给 backend，
  # 其余落 frontend 静态 nginx → 对 POST 报 405。经 customBackends 注入主 ingress。
  customBackends:
    - path: /keycloak-sms/
      pathType: Prefix
      backend:
        service:
          name: meet-backend
          port:
            number: 80

ingressAdmin:
  enabled: true
  className: nginx
  host: meet.we-meet.online
  # Django admin at /dj-admin/; front /admin/ is the management console (M 端) SPA.
  path: /dj-admin
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  tls:
    enabled: true
    secretName: meet-tls

# Recording-related ingresses disabled (recording disabled v1)
ingressMedia:
  enabled: false
ingressMediaFiles:
  enabled: false
ingressWebhook:
  enabled: false

posthog:
  ingress:
    enabled: false
  ingressAssets:
    enabled: false

# ---- Summary service (FastAPI) ----
summary:
  replicas: 1
  image:
    repository: jusi-cn-guangzhou.cr.volces.com/we-meet/meet-summary
    pullPolicy: Always
    tag: "latest"
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 384Mi
  envVars: &summaryEnvVars
    APP_NAME: meet-summary
    # APP_API_TOKEN 来自 values.secrets.yaml (= SUMMARY_SERVICE_API_TOKEN)

    AWS_STORAGE_BUCKET_NAME_VIDEO: we-meet-video
    AWS_S3_ENDPOINT_URL: https://oss-cn-shenzhen.aliyuncs.com
    AWS_S3_SECURE_ACCESS: "True"
    # AWS_S3_ACCESS_KEY_ID / AWS_S3_SECRET_ACCESS_KEY 来自 values.secrets.yaml

    # Legacy summary worker uses the same Qwen model and Bailian credentials.
    LLM_BASE_URL: https://dashscope.aliyuncs.com/compatible-mode/v1
    LLM_MODEL: "qwen3.8-flash"
    DASHSCOPE_API_KEY:
      secretKeyRef:
        name: meet-ai-credentials
        key: DASHSCOPE_API_KEY

    # WhisperX — v1 不开录制 → summary 不会真的发起音频转写, 这里只是
    # 占位满足 summary/core/config.py 的 pydantic 必填校验. 如果以后要
    # 接 OpenAI 兼容音频转写, 火山方舟没有, 需另接其他云或 self-host whisper.
    WHISPERX_BASE_URL: https://ark.cn-beijing.volces.com/api/v3
    WHISPERX_ASR_MODEL: whisper-1
    WHISPERX_DEFAULT_LANGUAGE: zh
    # WHISPERX_API_KEY 来自 values.secrets.yaml (复用 LLM_API_KEY)

    # AUTHORIZED_TENANTS 至少包含一个 v1 默认 tenant，否则启动失败 (config.py validate)
    # 直接靠 legacy APP_API_TOKEN/WEBHOOK_API_TOKEN/WEBHOOK_URL 三件套即可自动迁移
    WEBHOOK_URL: https://meet.we-meet.online/api/v1.0/recordings/summary/webhook/
    # WEBHOOK_API_TOKEN 来自 values.secrets.yaml

    # CELERY — 使用 in-cluster redis
    # CELERY_BROKER_URL / CELERY_RESULT_BACKEND / TASK_TRACKER_REDIS_URL 来自 values.secrets.yaml

# ---- Celery workers for the summary service ----
celeryTranscribe:
  replicas: 1
  image:
    repository: jusi-cn-guangzhou.cr.volces.com/we-meet/meet-summary
    pullPolicy: Always
    tag: "latest"
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 384Mi
  envVars: *summaryEnvVars
  command:
    - "celery"
    - "-A"
    - "summary.core.celery_worker"
    - "worker"
    - "--pool=solo"
    - "--loglevel=info"
    - "-Q"
    - "transcribe-queue,transcribe-queue-v2"

celerySummarize:
  replicas: 1
  image:
    repository: jusi-cn-guangzhou.cr.volces.com/we-meet/meet-summary
    pullPolicy: Always
    tag: "latest"
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 384Mi
  envVars: *summaryEnvVars
  command:
    - "celery"
    - "-A"
    - "summary.core.celery_worker"
    - "worker"
    - "--pool=solo"
    - "--loglevel=info"
    - "-Q"
    - "summarize-queue,summarize-queue-v2"

celerySummaryBackend:
  replicas: 1
  image:
    repository: jusi-cn-guangzhou.cr.volces.com/we-meet/meet-summary
    pullPolicy: Always
    tag: "latest"
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 384Mi
  envVars: *summaryEnvVars
  command:
    - "celery"
    - "-A"
    - "summary.core.celery_worker"
    - "worker"
    - "--pool=solo"
    - "--loglevel=info"
    - "-Q"
    - "call-webhook-queue-v2"

# ---- Celery worker for the meet backend (delivery, mailing, room callbacks) ----
celeryBackend:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 1Gi
  command:
    - "celery"
    - "-A"
    - "meet.celery_app"
    - "worker"
    - "--loglevel=info"
    - "--concurrency=2"
    - "-Q"
    - "meet-backend"

celeryBeat:
  enabled: true

# ---- Metadata collector agent (lightweight, no STT) ----
agentMetadata:
  replicas: 1
  image:
    repository: jusi-cn-guangzhou.cr.volces.com/we-meet/meet-agents
    pullPolicy: Always
    tag: "latest"
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 384Mi
  envVars:
    LIVEKIT_URL: https://livekit.we-meet.online/
    LIVEKIT_API_KEY: meet
    # LIVEKIT_API_SECRET 来自 values.secrets.yaml
    ENABLE_SILERO_VAD: "false"
    # 阿里云 OSS we-meet-video 主桶, 华南1(深圳)
    AWS_S3_ENDPOINT_URL: oss-cn-shenzhen.aliyuncs.com
    AWS_S3_SECURE_ACCESS: "True"
    AWS_STORAGE_BUCKET_NAME_VIDEO: we-meet-video
    AWS_S3_OUTPUT_FOLDER: metadata
  command:
    - "python"
    - "metadata_collector.py"
    - "start"

# ---- Subtitles / transcription agent (Qwen streaming ASR) ----
# Confirmed originals use the meeting delivery protocol and exact room occurrence.
agentSubtitles:
  replicas: 1
  image:
    repository: jusi-cn-guangzhou.cr.volces.com/we-meet/meet-agents
    pullPolicy: Always
    tag: "latest"
  envVars:
    LIVEKIT_URL: https://livekit.we-meet.online/
    LIVEKIT_API_KEY: meet
    # LIVEKIT_API_SECRET 来自 values.secrets.yaml
    ENABLE_SILERO_VAD: "true"
    STT_PROVIDER: qwen
    TRANSCRIBER_AGENT_NAME: multi-user-transcriber
    QWEN_ASR_MODEL: qwen-audio-3.0-asr-flash-streaming
    QWEN_ASR_REGION: cn-beijing
    DASHSCOPE_WORKSPACE_ID:
      secretKeyRef:
        name: meet-ai-credentials
        key: DASHSCOPE_WORKSPACE_ID
        optional: false
    DASHSCOPE_API_KEY:
      secretKeyRef:
        name: meet-ai-credentials
        key: DASHSCOPE_API_KEY
    # K8s 内部 service DNS — meet-backend service 监听 80 端口
    AGENT_BACKEND_API_URL: http://meet-backend
    # AGENT_INTERNAL_API_TOKEN 来自 values.secrets.yaml
    # Dedicated Qwen translation workers own translated output; keep originals separate.
    TRANSLATION_TARGET_LANGS: ""
  command:
    - "python"
    - "multi_user_transcriber.py"
    - "start"

# ---- Meeting AI assistant agent (Qwen-Omni) ----
# Meeting catalog and dispatch accept Qwen profiles; credentials stay in secrets.
agentAIAssistant:
  enabled: true
  replicas: 1
  image:
    repository: jusi-cn-guangzhou.cr.volces.com/we-meet/meet-agents
    pullPolicy: Always
    tag: "latest"
  command:
    - "python"
    - "ai_assistant.py"
    - "start"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 768Mi
  envVars:
    LIVEKIT_URL: https://livekit.we-meet.online/
    LIVEKIT_API_KEY: meet
    # LIVEKIT_API_SECRET 来自 values.secrets.yaml
    AI_AGENT_NAME: "ai-agent"
    FRAME_CAPTURE_INTERVAL: "1.0"
    ENABLE_SILERO_VAD: "true"
    # 以下所有 *_API_KEY / *_ACCESS_KEY / *_ACCESS_TOKEN / *_APP_ID
    # 来自 values.secrets.yaml:
    #   Qwen:           DASHSCOPE_API_KEY

# Meeting AI workers reuse credentials already supplied in values.secrets.yaml.
# release-meet.sh agents pins all five processes to the selected immutable image.
meetingAIWorkers:
  credentialsFromExistingEnv: true
  credentialsSecret: meet-ai-credentials
  backendUrl: http://meet-backend
  livekitUrl: wss://livekit.we-meet.online
  image:
    repository: jusi-cn-guangzhou.cr.volces.com/we-meet/meet-agents
    tag: latest
    pullPolicy: Always
  gateway:
    origins: https://meet.we-meet.online
    ingress:
      enabled: true
      className: nginx
      host: meet.we-meet.online
      tlsSecret: meet-tls
  workers:
    translation:
      enabled: true
    interpretation:
      enabled: true
    capture-asr:
      enabled: true
    capture-live-asr:
      enabled: true
    capture-translation:
      enabled: true
