global:
  scrape_interval: 15s
  scrape_timeout: 5s
  evaluation_interval: 15s

rule_files:
  - ../prometheus-rules.yaml
  - ../demo-rules.yaml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 127.0.0.1:19093

scrape_configs:
  - job_name: work-api
    static_configs:
      - targets:
          - 127.0.0.1:19091
  - job_name: work-demo
    static_configs:
      - targets:
          - 127.0.0.1:19092
  - job_name: prometheus
    static_configs:
      - targets:
          - 127.0.0.1:19090
