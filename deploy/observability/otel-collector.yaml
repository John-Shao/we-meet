receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}
  # Work carries IDs/hashes only; this processor drops known content keys if a
  # producer ever leaks them. The backend log scan is the primary guard.
  attributes/redact:
    actions:
      - key: goal
        action: delete
      - key: background
        action: delete
      - key: content
        action: delete
      - key: title
        action: delete
      - key: api_key
        action: delete

exporters:
  prometheus:
    endpoint: 0.0.0.0:8889
  logging:
    loglevel: warn

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch, attributes/redact]
      exporters: [logging]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
