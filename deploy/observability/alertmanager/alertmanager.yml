route:
  receiver: demo-discard
  group_by: [alertname, org_id]
  group_wait: 5s
  group_interval: 1m
  repeat_interval: 1h
  routes:
    - matchers:
        - alertname="WorkObservabilityDemoFailure"
        - alert_class="demo"
        - org_id="demo"
      receiver: demo-webhook
      continue: false

receivers:
  - name: demo-webhook
    webhook_configs:
      - url: http://127.0.0.1:19094/alerts
        send_resolved: true
  - name: demo-discard
