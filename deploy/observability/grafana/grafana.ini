[server]
http_addr = 127.0.0.1
http_port = 13000
root_url = http://127.0.0.1:13000/

[security]
admin_user = admin
admin_password = ${GF_SECURITY_ADMIN_PASSWORD}
disable_gravatar = true

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false

[log]
mode = console

[paths]
data = /var/lib/work-observability/grafana
logs = /var/log/work-observability/grafana
plugins = /var/lib/work-observability/grafana/plugins
provisioning = /etc/work-observability/grafana/provisioning
