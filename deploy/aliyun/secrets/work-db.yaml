# Template only: populate with the platform secret manager, never commit values.
# The Work API connection lands in E2 (D2); E1 uses the default Django
# connection with `work` in search_path. The login identity must SET ROLE to
# the NOLOGIN domain roles (D1 6.1).
apiVersion: v1
kind: Secret
metadata:
  name: work-db
  namespace: meet
type: Opaque
stringData:
  WORK_DB_USER: replace-with-workload-login-role
  WORK_DB_PASSWORD: replace-with-secret-manager-value
  WORK_DB_HOST: postgresql
  WORK_DB_PORT: "5432"
  WORK_DB_NAME: meet
  WORK_DB_SET_ROLE: work_api
