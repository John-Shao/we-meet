# Temporal PostgreSQL (Bitnami) for work-staging namespace
# Deploy: helm install temporal-postgresql bitnami/postgresql -n work-staging -f values.postgresql.yaml

global:
  postgresql:
    auth:
      postgresPassword: "temporal-postgres-root-2026"
      username: "temporal"
      password: "temporal-app-2026"
      database: "temporal_staging"

primary:
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 1
      memory: 2Gi
  persistence:
    enabled: true
    size: 10Gi
  configuration: |
    max_connections = 100
    shared_buffers = 256MB
    effective_cache_size = 768MB
    work_mem = 4MB
    maintenance_work_mem = 128MB
    wal_level = minimal
    max_wal_senders = 0
    max_replication_slots = 0

  podSecurityContext:
    enabled: true
    fsGroup: 1001
  containerSecurityContext:
    enabled: true
    runAsUser: 1001

  service:
    type: ClusterIP
    ports:
      postgresql: 5432

readReplicas:
  enabled: false

metrics:
  enabled: false
