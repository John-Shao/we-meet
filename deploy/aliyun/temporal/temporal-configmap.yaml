apiVersion: v1
kind: ConfigMap
metadata:
  name: temporal-config
  namespace: work-staging
data:
  config_template.yaml: |
    log:
      stdout: true
      level: info

    persistence:
      defaultStore: default
      visibilityStore: visibility
      numHistoryShards: 4
      datastores:
        default:
          sql:
            pluginName: "postgres12"
            databaseName: "temporal_staging"
            connectAddr: "postgresql.meet.svc.cluster.local:5432"
            connectionProtocol: "tcp"
            user: "temporal"
            password: "temporal-staging-2026"
            maxConns: 20
            maxIdleConns: 10
            maxConnLifetime: "1h"
            tls:
              enabled: false
            secretName: ""
        visibility:
          sql:
            pluginName: "postgres12"
            databaseName: "temporal_staging"
            connectAddr: "postgresql.meet.svc.cluster.local:5432"
            connectionProtocol: "tcp"
            user: "temporal"
            password: "temporal-staging-2026"
            maxConns: 20
            maxIdleConns: 10
            maxConnLifetime: "1h"
            tls:
              enabled: false

    global:
      membership:
        maxJoinDuration: 30s
        broadcastAddress: "0.0.0.0"
      pprof:
        port: 0
      metrics:
        prometheus:
          framework: "opentelemetry"
          listenerAddress: "0.0.0.0:9090"

    servers:
      frontend:
        rpc:
          grpcPort: 7233
          membershipPort: 6933
          httpPort: 7243
          bindOnIP: "0.0.0.0"

      matching:
        rpc:
          grpcPort: 7235
          membershipPort: 6935
          bindOnIP: "0.0.0.0"

      history:
        rpc:
          grpcPort: 7234
          membershipPort: 6934
          bindOnIP: "0.0.0.0"

      worker:
        rpc:
          grpcPort: 7239
          membershipPort: 6939
          bindOnIP: "0.0.0.0"

    clusterMetadata:
      enableGlobalNamespace: false
      failoverVersionIncrement: 10
      masterClusterName: "active"
      currentClusterName: "active"
      clusterInformation:
        active:
          enabled: true
          initialFailoverVersion: 1
          rpcName: "frontend"
          rpcAddress: "127.0.0.1:7233"

    dcRedirectionPolicy:
      policy: "noop"

    archivial:
      history:
        provider: "noop"
      visibility:
        provider: "noop"

    namespaceDefaults:
      archivial:
        history:
          enabled: false
        visibility:
          enabled: false

    publicClient:
      hostPort: "temporal-server.work-staging.svc.cluster.local:7233"

    authorization:
      jwtKeyProvider:
        keySourceURIs: []
      permissionsClaimName: "permissions"
