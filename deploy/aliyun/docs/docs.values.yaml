# docs.values.yaml — La Suite Docs 独立机（aliyun-docs）helm values（P3 协作文档）
#
# 用途：在 aliyun-docs（单节点 k3s）上 helm install 我们 fork+定制的 Docs。
#   helm install impress <chart> -n docs --create-namespace -f docs.values.yaml
#   chart 用 we-meet-docs 仓库的 src/helm/impress（pin 到 v5.4.1，与镜像同版本）
#
# 设计/决策：docs/phases/p3-collab-docs.md（§五）
# 部署 runbook：docs/installation/docs-server.md
# 镜像构建：deploy/aliyun/docs/build-and-push.sh（自建三镜像推火山 CR，含简体中文 + API_ORIGIN 烘焙）
#
# ⚠️ 本文件是对着 v5.4.1 的 documentation/examples/helm/impress.values.yaml 落的实值模板。
#    所有 __占位__ 部署前替换；ListValue 类 env 是「逗号分隔纯字符串」不是 JSON 数组。
#    换域名（如 jusiai.com）：全局替换 we-meet.online。
# ---------------------------------------------------------------------------

# ============ 顶层：OIDC client（chart 会注入到 backend）============
oidc:
  clientId: docs
  clientSecret: "__DOCS_CLIENT_SECRET__"        # bootstrap-docs-client.sh 生成的 docs client secret

# ============ backend 镜像 → 火山 CR we-meet 命名空间（自建，含简体中文）============
image:
  repository: jusi-cn-guangzhou.cr.volces.com/we-meet/impress-backend
  pullPolicy: IfNotPresent
  tag: "docs-dev-v5.4.1"                         # pin，别用 latest；与 build-and-push.sh 的 TAG 一致

backend:
  replicas: 1
  envVars:
    # ---- Django 核心 ----
    DJANGO_CONFIGURATION: Production
    DJANGO_SETTINGS_MODULE: impress.settings
    DJANGO_SECRET_KEY: "__DJANGO_SECRET_KEY__"   # openssl rand -hex 32
    DJANGO_ALLOWED_HOSTS: docs.we-meet.online
    DJANGO_CSRF_TRUSTED_ORIGINS: https://docs.we-meet.online

    # ---- 妙记落 Doc 的服务端 token（关键对接点：与 meet 后端 DOCS_SERVER_TO_SERVER_TOKEN 同值）----
    # ListValue：多个用逗号分隔。高权限，绝不外泄/进前端。
    DJANGO_SERVER_TO_SERVER_API_TOKENS: "__DOCS_S2S_TOKEN__"

    # ---- 简体中文优先（Bucket R，运行时启用；译文内容已烘焙进镜像）----
    DJANGO_LANGUAGE_CODE: zh-cn
    # SingleNestedTupleValue：code:Label 逗号分隔，首项=默认优先
    DJANGO_LANGUAGES: "zh-cn:简体中文,en-us:English,fr-fr:Français,de-de:Deutsch,nl-nl:Nederlands"

    # ---- OIDC → 同一个 Keycloak realm `meet`（与 meet 共 SSO，新标签免登）----
    OIDC_OP_JWKS_ENDPOINT: https://id.we-meet.online/realms/meet/protocol/openid-connect/certs
    OIDC_OP_AUTHORIZATION_ENDPOINT: https://id.we-meet.online/realms/meet/protocol/openid-connect/auth
    OIDC_OP_TOKEN_ENDPOINT: https://id.we-meet.online/realms/meet/protocol/openid-connect/token
    OIDC_OP_USER_ENDPOINT: https://id.we-meet.online/realms/meet/protocol/openid-connect/userinfo
    OIDC_OP_LOGOUT_ENDPOINT: https://id.we-meet.online/realms/meet/protocol/openid-connect/logout
    OIDC_RP_CLIENT_ID: docs
    OIDC_RP_CLIENT_SECRET: "__DOCS_CLIENT_SECRET__"
    OIDC_RP_SIGN_ALGO: RS256
    OIDC_RP_SCOPES: "openid email"
    # ListValue（逗号分隔），不是 JSON 数组
    OIDC_REDIRECT_ALLOWED_HOSTS: https://docs.we-meet.online
    LOGIN_REDIRECT_URL: https://docs.we-meet.online
    LOGIN_REDIRECT_URL_FAILURE: https://docs.we-meet.online
    LOGOUT_REDIRECT_URL: https://docs.we-meet.online
    # 用户字段映射（照 Keycloak realm meet 的 claim；与 example 一致）
    OIDC_USERINFO_SHORTNAME_FIELD: given_name
    OIDC_USERINFO_FULLNAME_FIELDS: "given_name,usual_name"

    # ---- 数据库：Docs 专属 PG（与 meet 完全隔离）----
    # PG 单独装（bitnami helm 或自建，同 meet 那套），改 host/creds 指过去
    DB_HOST: postgres-docs-postgresql.docs.svc.cluster.local
    DB_NAME: impress
    DB_USER: dinum
    DB_PASSWORD: "__DOCS_DB_PASSWORD__"
    DB_PORT: 5432

    # ---- Redis：Docs 专属 ----
    REDIS_URL: redis://:__DOCS_REDIS_PASSWORD__@redis-docs-master.docs.svc.cluster.local:6379/1
    DJANGO_CELERY_BROKER_URL: redis://:__DOCS_REDIS_PASSWORD__@redis-docs-master.docs.svc.cluster.local:6379/0

    # ---- 对象存储 → 阿里云 OSS 深圳（S3 兼容，与本机同区；不用 minio）----
    AWS_S3_ENDPOINT_URL: https://oss-cn-shenzhen.aliyuncs.com
    AWS_S3_ACCESS_KEY_ID: "__OSS_AK__"
    AWS_S3_SECRET_ACCESS_KEY: "__OSS_SK__"
    AWS_STORAGE_BUCKET_NAME: we-meet-docs
    AWS_S3_REGION_NAME: oss-cn-shenzhen        # ⚠️ SigV4 签名区，OSS S3 兼容需实测；错了报 403 SignatureDoesNotMatch（备选纯 cn-shenzhen）
    AWS_S3_ADDRESSING_STYLE: virtual           # OSS 走 vhost 风格（<bucket>.oss-cn-shenzhen.aliyuncs.com）
    STORAGES_STATICFILES_BACKEND: django.contrib.staticfiles.storage.StaticFilesStorage

    # ---- 协同 ws（y-provider）后端对接 ----
    Y_PROVIDER_API_BASE_URL: http://impress-y-provider:443/api/
    Y_PROVIDER_API_KEY: "__Y_PROVIDER_API_KEY__"           # openssl rand -hex 32
    COLLABORATION_SERVER_SECRET: "__COLLAB_SERVER_SECRET__" # openssl rand -hex 32

    # ---- 邮件（品牌暂不改；如需中文署名后续设 DJANGO_EMAIL_BRAND_NAME）----
    # DJANGO_EMAIL_BRAND_NAME: "we-meet"
    DJANGO_EMAIL_HOST: "__SMTP_HOST__"
    DJANGO_EMAIL_PORT: 465
    DJANGO_EMAIL_HOST_USER: "__SMTP_USER__"
    DJANGO_EMAIL_HOST_PASSWORD: "__SMTP_PASSWORD__"
    DJANGO_EMAIL_USE_SSL: True
    DJANGO_EMAIL_FROM: "__SMTP_FROM__"
    DJANGO_EMAIL_URL_APP: https://docs.we-meet.online

    LOGGING_LEVEL_LOGGERS_ROOT: INFO
    LOGGING_LEVEL_LOGGERS_APP: INFO
    # 每次发布刷新前端 config 缓存
    CACHES_KEY_PREFIX: "{{ now | unixEpoch }}"

  # 迁移 job（照 example：等 DB 就绪再 migrate）
  migrate:
    command:
      - "/bin/sh"
      - "-c"
      - |
        while ! python manage.py check --database default > /dev/null 2>&1; do
          echo "Database not ready"; sleep 2
        done
        echo "Database is ready"
        python manage.py migrate --no-input
    restartPolicy: Never

# ============ frontend 镜像 → 火山 CR（自建，API_ORIGIN 已烘焙为 docs.we-meet.online）============
# ⚠️ 前端是静态导出，NEXT_PUBLIC_API_ORIGIN 在 build 期定死；换域名必须重 build（见 build-and-push.sh）
frontend:
  replicas: 1
  image:
    repository: jusi-cn-guangzhou.cr.volces.com/we-meet/impress-frontend
    pullPolicy: IfNotPresent
    tag: "docs-dev-v5.4.1"

# ============ y-provider（协同 ws）镜像 → 火山 CR（自建）============
yProvider:
  replicas: 1
  image:
    repository: jusi-cn-guangzhou.cr.volces.com/we-meet/impress-y-provider
    pullPolicy: IfNotPresent
    tag: "docs-dev-v5.4.1"
  envVars:
    COLLABORATION_BACKEND_BASE_URL: https://docs.we-meet.online
    COLLABORATION_SERVER_ORIGIN: https://docs.we-meet.online
    COLLABORATION_SERVER_SECRET: "__COLLAB_SERVER_SECRET__"  # 与 backend 同值
    Y_PROVIDER_API_KEY: "__Y_PROVIDER_API_KEY__"             # 与 backend 同值
    COLLABORATION_LOGGING: "true"

# ============ Ingress（k3s traefik/ingress-nginx + cert-manager LE）============
# 主站 + 协同 ws/api + admin 都挂 docs.we-meet.online；TLS 走 cert-manager letsencrypt
ingress:
  enabled: true
  host: docs.we-meet.online
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: 100m
  tls:
    enabled: true
    secretName: docs-tls

ingressCollaborationWS:
  enabled: true
  host: docs.we-meet.online
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  tls:
    enabled: true
    secretName: docs-tls

ingressCollaborationApi:
  enabled: true
  host: docs.we-meet.online
  tls:
    enabled: true
    secretName: docs-tls

ingressAdmin:
  enabled: true
  host: docs.we-meet.online
  tls:
    enabled: true
    secretName: docs-tls

# ============ Media 代理 → 阿里云 OSS 深圳 ⚠️ 部署时务必实测 ============
# 机制：ingressMedia 把 /media/(.*) 经 media-auth 鉴权后反代到 serviceMedia(S3 后端)。
# 外部 OSS 与 example 的 in-cluster minio 不同，以下为「虚拟主机风格 + HTTPS 上游」的最可能配置，
# ⚠️ OSS 的 path-style vs vhost-style、TLS SNI 需实测；跑不通就试 path-style + rewrite-target。
serviceMedia:
  host: we-meet-docs.oss-cn-shenzhen.aliyuncs.com   # vhost 风格：<bucket>.<endpoint>
  port: 443

ingressMedia:
  enabled: true
  host: docs.we-meet.online
  path: /media/(.*)
  tls:
    enabled: true
    secretName: docs-tls
  annotations:
    nginx.ingress.kubernetes.io/auth-url: https://docs.we-meet.online/api/v1.0/documents/media-auth/
    nginx.ingress.kubernetes.io/auth-response-headers: "Authorization, X-Amz-Date, X-Amz-Content-SHA256"
    nginx.ingress.kubernetes.io/backend-protocol: HTTPS
    nginx.ingress.kubernetes.io/upstream-vhost: we-meet-docs.oss-cn-shenzhen.aliyuncs.com
    nginx.ingress.kubernetes.io/rewrite-target: /$1
    nginx.ingress.kubernetes.io/configuration-snippet: |
      add_header Content-Security-Policy "default-src 'none'" always;

# posthog 分析：关闭
posthog:
  ingress:
    enabled: false
  ingressAssets:
    enabled: false
