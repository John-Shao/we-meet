# Meet-side entry for the Work control plane (applied on the meet k3s cluster).
# The Endpoints address is the Work ECS private IP; keep it in sync with the
# VPC layout. The Work ECS ingress listens on NodePort 30080.
apiVersion: v1
kind: Service
metadata:
  name: work-api-external
  namespace: meet
spec:
  ports:
    - name: http
      port: 80
      targetPort: 30080
---
apiVersion: v1
kind: Endpoints
metadata:
  name: work-api-external
  namespace: meet
subsets:
  - addresses:
      - ip: 172.16.0.7
    ports:
      - name: http
        port: 30080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: meet-work-api
  namespace: meet
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - meet.we-meet.online
      secretName: meet-tls
  rules:
    - host: meet.we-meet.online
      http:
        paths:
          - path: /work/v1
            pathType: Prefix
            backend:
              service:
                name: work-api-external
                port:
                  number: 80
