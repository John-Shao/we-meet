syntax = "proto3";

package work.common.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option go_package = "we-meet/gen/work/common/v1;commonv1";

// 内部协议只由工作负载身份调用；OrgContext 由控制面认证结果注入，不能由客户端提交。
message OrgContext {
  string org_id = 1;
  string subject_id = 2;
  string session_id = 3;
  string trace_id = 4;
}

message TaskRef {
  string org_id = 1;
  string task_id = 2;
}

message RunRef {
  string org_id = 1;
  string task_id = 2;
  string run_id = 3;
}

message OperationRef {
  string org_id = 1;
  string run_id = 2;
  string operation_id = 3;
}

message ApprovalRef {
  string org_id = 1;
  string approval_id = 2;
}

message ArtifactVersionRef {
  string org_id = 1;
  string artifact_id = 2;
  int32 version_no = 3;
}

message Money {
  int64 amount_cents = 1;
  string currency = 2;
  string price_version = 3;
}

message Usage {
  int64 input_tokens = 1;
  int64 output_tokens = 2;
  int64 reasoning_tokens = 3;
  int64 cached_tokens = 4;
  int64 tool_units = 5;
  // 供应商原始 usage；不得含提示词、回答正文或密钥。
  google.protobuf.Struct raw = 6;
}

message Error {
  ErrorCode code = 1;
  string message = 2;
  bool retryable = 3;
  string correlation_id = 4;
  int64 current_revision = 5;
  string recovery_action = 6;
}

enum PermissionMode {
  PERMISSION_MODE_UNSPECIFIED = 0;
  PERMISSION_MODE_ASK_EACH = 1;
  PERMISSION_MODE_AUTO_READONLY = 2;
  PERMISSION_MODE_PLAN_THEN_RUN = 3;
}

enum TaskState {
  TASK_STATE_UNSPECIFIED = 0;
  TASK_STATE_OPEN = 1;
  TASK_STATE_AWAITING_ACCEPTANCE = 2;
  TASK_STATE_COMPLETED = 3;
  TASK_STATE_CANCELED = 4;
  TASK_STATE_ARCHIVED = 5;
}

enum RunState {
  RUN_STATE_UNSPECIFIED = 0;
  RUN_STATE_QUEUED = 1;
  RUN_STATE_ACTIVE = 2;
  RUN_STATE_WAITING = 3;
  RUN_STATE_CANCEL_REQUESTED = 4;
  RUN_STATE_SUCCEEDED = 5;
  RUN_STATE_FAILED = 6;
  RUN_STATE_CANCELED = 7;
}

enum RunOutcome {
  RUN_OUTCOME_UNSPECIFIED = 0;
  RUN_OUTCOME_SUCCEEDED = 1;
  RUN_OUTCOME_FAILED = 2;
  RUN_OUTCOME_CANCELED = 3;
}

enum WaitReason {
  WAIT_REASON_UNSPECIFIED = 0;
  WAIT_REASON_APPROVAL = 1;
  WAIT_REASON_INPUT = 2;
  WAIT_REASON_BUDGET = 3;
  WAIT_REASON_DEVICE = 4;
  WAIT_REASON_PROVIDER = 5;
  WAIT_REASON_RECONCILE = 6;
}

enum OperationState {
  OPERATION_STATE_UNSPECIFIED = 0;
  OPERATION_STATE_PREPARED = 1;
  OPERATION_STATE_WAITING_APPROVAL = 2;
  OPERATION_STATE_AUTHORIZED = 3;
  OPERATION_STATE_DISPATCHING = 4;
  OPERATION_STATE_UNKNOWN = 5;
  OPERATION_STATE_SUCCEEDED = 6;
  OPERATION_STATE_FAILED = 7;
  OPERATION_STATE_CANCELED = 8;
  OPERATION_STATE_RECONCILED = 9;
  OPERATION_STATE_UNRESOLVED = 10;
}

enum OperationKind {
  OPERATION_KIND_UNSPECIFIED = 0;
  OPERATION_KIND_MODEL = 1;
  OPERATION_KIND_TOOL = 2;
  OPERATION_KIND_CONNECTOR = 3;
  OPERATION_KIND_ARTIFACT = 4;
  OPERATION_KIND_JOURNAL = 5;
}

enum ApprovalStatus {
  APPROVAL_STATUS_UNSPECIFIED = 0;
  APPROVAL_STATUS_PENDING = 1;
  APPROVAL_STATUS_APPROVED = 2;
  APPROVAL_STATUS_REJECTED = 3;
  APPROVAL_STATUS_EXPIRED = 4;
  APPROVAL_STATUS_REVOKED = 5;
}

enum Decision {
  DECISION_UNSPECIFIED = 0;
  DECISION_APPROVED = 1;
  DECISION_REJECTED = 2;
}

enum ArtifactState {
  ARTIFACT_STATE_UNSPECIFIED = 0;
  ARTIFACT_STATE_STAGED = 1;
  ARTIFACT_STATE_PUBLISHED = 2;
  ARTIFACT_STATE_QUARANTINED = 3;
}

enum TargetKind {
  TARGET_KIND_UNSPECIFIED = 0;
  TARGET_KIND_CLOUD = 1;
  TARGET_KIND_LOCAL = 2;
  TARGET_KIND_REMOTE = 3;
}

enum RiskLevel {
  RISK_LEVEL_UNSPECIFIED = 0;
  RISK_LEVEL_LOW = 1;
  RISK_LEVEL_MEDIUM = 2;
  RISK_LEVEL_HIGH = 3;
}

// 与 OpenAPI ErrorCode 保持同名语义；新增值必须保持兼容。
enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_INVALID_REQUEST = 1;
  ERROR_CODE_IDEMPOTENCY_KEY_MISMATCH = 2;
  ERROR_CODE_IDEMPOTENCY_CONFLICT = 3;
  ERROR_CODE_SCOPE_UNAVAILABLE = 4;
  ERROR_CODE_PREVIEW_STALE = 5;
  ERROR_CODE_POLICY_CHANGED = 6;
  ERROR_CODE_PERMISSION_MODE_UNAVAILABLE = 7;
  ERROR_CODE_APPROVAL_EXPIRED = 8;
  ERROR_CODE_BUDGET_EXHAUSTED = 9;
  ERROR_CODE_DEVICE_OFFLINE = 10;
  ERROR_CODE_EXECUTION_UNKNOWN = 11;
  ERROR_CODE_RUN_NOT_QUIESCENT = 12;
  ERROR_CODE_VERSION_CONFLICT = 13;
  ERROR_CODE_CONTENT_LOCAL_ONLY = 14;
  ERROR_CODE_PROTOCOL_UNSUPPORTED = 15;
  ERROR_CODE_RESYNC_REQUIRED = 16;
  ERROR_CODE_SERVICE_DEGRADED = 17;
}

message Target {
  TargetKind kind = 1;
  string profile = 2;
  string device_id = 3;
}

message Quiescence {
  bool has_blocking_operation = 1;
  int32 blocking_operation_count = 2;
  int64 task_revision = 3;
  repeated string blocking_operation_ids = 4;
}

// 规范化事件信封；禁止把原始 reasoning、目录绝对路径或凭据放入 payload。
message EventEnvelope {
  string event_id = 1;
  string org_id = 2;
  string aggregate_type = 3;
  string aggregate_id = 4;
  int64 aggregate_seq = 5;
  int32 schema_version = 6;
  google.protobuf.Timestamp occurred_at = 7;
  string type = 8;
  google.protobuf.Struct payload = 9;
  string content_ref = 10;
}
