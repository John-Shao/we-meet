openapi: 3.1.0
info:
  title: WeMeet Work R0a API
  version: 0.1.0
  description: |
    R0a 云端主场景的公开 API 子集。只包含 Composer、输入、模板、任务/运行、
    SSE、收件箱、文本成果与只读管理面；不暴露 R0b 本机、R2 连接器、R3 项目、
    计划审批或远程设备接口。

    公开用户 API 只使用 HttpOnly cookie 会话；变更请求另带 X-CSRF-Token
    （double-submit）。内部服务身份/mTLS 不在此公开契约中描述。
    所有正文只通过受控内容接口返回，不进入事件、错误或日志。
servers:
  - url: /
security:
  - cookieAuth: []
tags:
  - name: Session
  - name: Inputs
  - name: Templates
  - name: Tasks
  - name: Runs
  - name: Events
  - name: Inbox
  - name: Artifacts
  - name: Admin
  - name: Usage
  - name: Provider

paths:
  /work/v1/bootstrap:
    get:
      tags: [Session]
      operationId: getBootstrap
      summary: 当前会话、组织、阶段、执行目标与限制
      responses:
        "200":
          description: 已认证会话
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Bootstrap" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /work/v1/inputs:
    post:
      tags: [Inputs]
      operationId: createInput
      summary: 创建或复用文本输入，返回不透明 input_ref
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InputCreateRequest" }
      responses:
        "401": { $ref: "#/components/responses/Unauthorized" }
        "201":
          description: 输入已持久化；正文由 Content Store 保存
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InputObject" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /work/v1/templates:
    get:
      tags: [Templates]
      operationId: listTemplates
      summary: 内置方法模板（服务端版本化资产，不是能力注册表）
      responses:
        "200":
          description: 模板列表
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TemplateList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /work/v1/task-previews:
    post:
      tags: [Tasks]
      operationId: createTaskPreview
      summary: 解析输入/模板/权限/token 配额，返回执行边界与 preview_hash
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskPreviewRequest" }
      responses:
        "401": { $ref: "#/components/responses/Unauthorized" }
        "200":
          description: 预览与 token 上限；计费在客户自己的云厂商侧，Work 不报价
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskPreview" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /work/v1/tasks:
    get:
      tags: [Tasks]
      operationId: listTasks
      summary: 本人可见的任务摘要
      parameters:
        - name: view
          in: query
          required: false
          schema:
            type: string
            enum: [pending, running, awaiting_acceptance, completed, all]
            default: all
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: 任务摘要页
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Tasks]
      operationId: submitTask
      summary: 幂等提交 Task 与首个 Run
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskSubmitRequest" }
      responses:
        "401": { $ref: "#/components/responses/Unauthorized" }
        "202":
          description: 已持久受理，不代表模型已开始或已计费
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskRun" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /work/v1/tasks/{taskId}:
    get:
      tags: [Tasks]
      operationId: getTask
      summary: 任务详情（摘要、输入、模板）
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: 任务详情
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Tasks]
      operationId: updateTask
      summary: 编辑任务标题（乐观并发）；只改元数据，不影响 Run/快照/成果
      parameters:
        - $ref: "#/components/parameters/TaskId"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskUpdateRequest" }
      responses:
        "401": { $ref: "#/components/responses/Unauthorized" }
        "200":
          description: 更新后的任务摘要；revision 递增
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskSummary" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
    delete:
      tags: [Tasks]
      operationId: deleteTask
      summary: 删除本人任务（需静止）；成果/输入不可再读，正文异步粉碎，账本与审计保留
      parameters:
        - $ref: "#/components/parameters/TaskId"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/ExpectedRevision"
      responses:
        "401": { $ref: "#/components/responses/Unauthorized" }
        "200":
          description: 已删除；重复删除返回同一结果（不再校验 revision）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskDeletion" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /work/v1/tasks/{taskId}/runs:
    post:
      tags: [Runs]
      operationId: retryTask
      summary: 创建新 Run；沿用 Task 当前快照
      description: Task 必须为 open 且最近 Run 为 failed/canceled；expected_revision 与 target 必填。
      parameters:
        - $ref: "#/components/parameters/TaskId"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskRunRequest" }
      responses:
        "401": { $ref: "#/components/responses/Unauthorized" }
        "202":
          description: 新 Run 已持久受理
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskRun" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /work/v1/runs/{runId}:
    get:
      tags: [Runs]
      operationId: getRun
      summary: 运行状态与等待/终态原因
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: 运行
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /work/v1/runs/{runId}/operations:
    get:
      tags: [Runs]
      operationId: listOperations
      summary: 运行中的 Operation（不含正文）
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Operation 页
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /work/v1/runs/{runId}/cancel:
    post:
      tags: [Runs]
      operationId: cancelRun
      summary: 幂等请求取消；不谎报进程已停止
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CancelRequest" }
      responses:
        "401": { $ref: "#/components/responses/Unauthorized" }
        "202":
          description: 取消请求已受理
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /work/v1/tasks/{taskId}/events:
    get:
      tags: [Events]
      operationId: streamTaskEvents
      summary: Task SSE；Last-Event-ID 恢复
      parameters:
        - $ref: "#/components/parameters/TaskId"
        - name: Last-Event-ID
          in: header
          required: false
          schema: { type: string }
      responses:
        "200":
          description: |
            每个事件 id 为 event_id，data 为 TaskEvent JSON；
            不支持 text/event-stream 的客户端应回退到任务快照 + 重新订阅。
          content:
            text/event-stream:
              schema: { type: string }
              example: |
                id: 5f0f8f2e-1f1b-4c7a-9a1d-2c3b4a5d6e7f
                event: task.updated
                data: {"event_id":"5f0f8f2e-1f1b-4c7a-9a1d-2c3b4a5d6e7f","task_id":"...","seq":1,"schema_version":"work-event-v1","occurred_at":"2026-10-25T10:00:00Z","type":"task.submitted","payload":{}}
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: 游标超出保留窗口，必须重新取 Task 快照
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /work/v1/inbox:
    get:
      tags: [Inbox]
      operationId: listInbox
      summary: 跨 Task“需要你”只读投影；R0a 轮询
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: 收件箱页
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InboxPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /work/v1/artifacts/{artifactId}/versions:
    post:
      tags: [Artifacts]
      operationId: createArtifactVersion
      summary: 用户保存文本新版本；不覆盖旧版本
      description: 仅当 Task 为 open/awaiting_acceptance 且最近 Run 非 failed/canceled 时允许，否则 409 artifact_read_only；base_version_no 必须等于最新已发布版本，否则 409 version_conflict。
      parameters:
        - $ref: "#/components/parameters/ArtifactId"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ArtifactVersionCreateRequest" }
      responses:
        "401": { $ref: "#/components/responses/Unauthorized" }
        "201":
          description: 新版本已发布
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArtifactVersion" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /work/v1/artifacts/{artifactId}/versions/{versionNo}:
    get:
      tags: [Artifacts]
      operationId: getArtifactVersion
      summary: 版本元数据与受控内容入口
      parameters:
        - $ref: "#/components/parameters/ArtifactId"
        - $ref: "#/components/parameters/VersionNo"
      responses:
        "200":
          description: 版本
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArtifactVersion" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /work/v1/artifacts/{artifactId}/versions/{versionNo}/content:
    get:
      tags: [Artifacts]
      operationId: getArtifactContent
      summary: 受控正文读取/下载；不缓存、不写日志；attachment 记审计
      parameters:
        - $ref: "#/components/parameters/ArtifactId"
        - $ref: "#/components/parameters/VersionNo"
        - name: disposition
          in: query
          required: false
          description: |
            inline=页面内渲染；attachment=导出下载，服务端生成安全文件名
            （RFC 6266 filename*=UTF-8''，不含任务标题以外的正文），并写
            artifact.exported 审计（不含正文）。R0a 不提供分享链接或格式转换。
          schema: { type: string, enum: [inline, attachment], default: inline }
      responses:
        "200":
          description: Markdown/纯文本正文
          headers:
            Cache-Control:
              schema: { type: string, enum: ["no-store"] }
            Content-Disposition:
              schema: { type: string }
              description: attachment 时为 `attachment; filename="work-<artifact8>-v<n>.md"; filename*=UTF-8''<标题>-v<n>.md`
            X-Content-Type-Options:
              schema: { type: string, enum: [nosniff] }
          content:
            text/markdown:
              schema: { type: string }
            text/plain:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "410":
          description: 正文已过期
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /work/v1/tasks/{taskId}/acceptances:
    post:
      tags: [Artifacts]
      operationId: acceptTask
      summary: 采纳固定版本或记录完成理由
      parameters:
        - $ref: "#/components/parameters/TaskId"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AcceptanceRequest" }
      responses:
        "401": { $ref: "#/components/responses/Unauthorized" }
        "200":
          description: 采纳结果
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AcceptanceResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /work/v1/me/usage:
    get:
      tags: [Usage]
      operationId: getUserUsage
      summary: 当前用户自己的 token 用量（只读本人，跨用户返回 403）
      description: |
        只统计 token 事实，不含金额；input/output/cached 分列。数据按 (用户, provider, model, 自然日) 聚合，
        仅供参考，费用以客户云厂商账单为准。区间上限 366 天。
      parameters:
        - $ref: "#/components/parameters/UsageFrom"
        - $ref: "#/components/parameters/UsageTo"
      responses:
        "200":
          description: 本人用量
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserUsage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /work/v1/admin/usage:
    get:
      tags: [Usage]
      operationId: getAdminUsage
      summary: 组织按模型分列的 token 用量（owner/admin）
      description: 按 provider + model 汇总组织内所有用户；同样只作用量参考，不作计费依据。
      parameters:
        - $ref: "#/components/parameters/UsageFrom"
        - $ref: "#/components/parameters/UsageTo"
      responses:
        "200":
          description: 组织用量
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrgUsage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /work/v1/admin/provider-config:
    get:
      tags: [Provider]
      operationId: getProviderConfig
      summary: 本组织当前生效的大模型接入配置（仅 owner）
      description: 只返回 provider/model/region/endpoint 与凭据指纹；任何情况下都不返回密钥明文或密文。
      responses:
        "200":
          description: 当前配置；尚未配置或已吊销时返回 404 not_found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderConfigView" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Provider]
      operationId: setProviderConfig
      summary: 切换本组织的大模型接入配置（仅 owner，版本化）
      description: |
        每次写入生成新 revision 并把上一条标记 superseded；expected_revision 不一致返回 409 version_conflict。
        保存前网关会发一次最小真实请求做连通探测，失败不生效。变更写强审计（操作人/组织/版本/指纹）。
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProviderConfigSetRequest" }
      responses:
        "200":
          description: 新配置已生效
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderConfigView" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /work/v1/admin/provider-config/revoke:
    post:
      tags: [Provider]
      operationId: revokeProviderConfig
      summary: 吊销本组织当前接入配置（仅 owner；新调用立即失败）
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProviderRevokeRequest" }
      responses:
        "200":
          description: 已吊销
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderConfigRevoked" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /work/v1/admin/provider-credentials:
    post:
      tags: [Provider]
      operationId: createProviderCredential
      summary: 为本组织创建大模型凭证（仅 owner；只写不回读）
      description: |
        阿里云/火山引擎走 sts_role：只提交角色标识，平台不持有长期密钥。
        DeepSeek 走 managed_key：提交 api_key，服务端用 KMS 信封加密后只存密文；
        接口只回指纹与密钥版本，任何读取路径都不返回明文。同一 provider 同时只能有一个 active 凭证。
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProviderCredentialCreateRequest" }
      responses:
        "201":
          description: 凭证已创建
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderCredentialView" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /work/v1/admin/provider-credentials/{credentialId}/rotate:
    post:
      tags: [Provider]
      operationId: rotateProviderCredential
      summary: 轮换托管 Key（仅 owner；新版本立即生效）
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/CredentialId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProviderCredentialRotateRequest" }
      responses:
        "200":
          description: 轮换后的凭证视图（仍只含指纹）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderCredentialView" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /work/v1/admin/provider-credentials/{credentialId}/revoke:
    post:
      tags: [Provider]
      operationId: revokeProviderCredential
      summary: 即时吊销凭证（仅 owner；在途调用以受控错误结束）
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/CredentialId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProviderRevokeRequest" }
      responses:
        "200":
          description: 已吊销
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderCredentialRevoked" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /work/v1/admin/overview:
    get:
      tags: [Admin]
      operationId: getAdminOverview
      summary: 当前主组织的治理元数据，不返回成员正文
      responses:
        "200":
          description: 组织治理概览
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminOverview" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /work/v1/admin/seats:
    get:
      tags: [Admin]
      operationId: listSeats
      summary: 只读席位列表
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: 席位页
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SeatPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /work/v1/admin/audit-exports:
    post:
      tags: [Admin]
      operationId: createAuditExport
      summary: 创建异步审计导出作业（202 受理，正文由 worker 写入 Content Store）
      description: |
        只导出审计事件元数据（动作、主体、目标、时间、哈希/字节数），不含任务或成果正文。
        同一 client_request_id 同参数重放返回同一作业；参数不同返回 409 idempotency_key_conflict。
        范围必须落在留存窗口内且不晚于当前时间，跨度上限 92 天。仅 owner/admin 可调用。
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AuditExportRequest" }
      responses:
        "401": { $ref: "#/components/responses/Unauthorized" }
        "202":
          description: 导出作业已受理，状态为 queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditExport" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /work/v1/admin/audit-exports/{exportId}:
    get:
      tags: [Admin]
      operationId: getAuditExport
      summary: 查询审计导出作业状态
      description: |
        仅作业所属组织的 owner/admin 可见；其他组织或不存在一律 404，不泄露作业是否存在。
        读取时若 ready 已过有效期，服务端把状态落为 expired（惰性过期），worker 另有清扫。
      parameters:
        - $ref: "#/components/parameters/ExportId"
      responses:
        "200":
          description: 导出作业
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditExport" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /work/v1/admin/audit-exports/{exportId}/download-ticket:
    post:
      tags: [Admin]
      operationId: createAuditExportTicket
      summary: 为已就绪作业发放一次性下载凭证
      description: |
        明文 token 只在本响应出现一次；服务端只保存其 SHA-256 哈希。
        作业未 ready → 409 audit_export_not_ready；已过期 → 410 audit_export_expired；
        已下载过 → 409 audit_export_already_downloaded（不重复发放）。
      parameters:
        - $ref: "#/components/parameters/ExportId"
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: 一次性凭证与其有效期
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditExportTicket" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "410":
          description: 作业内容已过期
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /work/v1/admin/audit-exports/{exportId}/content:
    get:
      tags: [Admin]
      operationId: getAuditExportContent
      summary: 用一次性凭证兑换导出文件
      description: |
        需要会话 cookie + 管理员角色 + 有效 X-Download-Token；校验通过后标记为已下载，
        同一凭证再次使用返回 403 download_token_invalid。响应不缓存、不写正文日志。
      parameters:
        - $ref: "#/components/parameters/ExportId"
        - $ref: "#/components/parameters/DownloadToken"
      responses:
        "200":
          description: 导出文件正文（按请求的 format）
          headers:
            Cache-Control:
              schema: { type: string, enum: ["no-store"] }
            Content-Disposition:
              schema: { type: string }
            X-Content-Type-Options:
              schema: { type: string, enum: [nosniff] }
          content:
            text/csv:
              schema: { type: string }
            application/json:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "410":
          description: 凭证或作业已过期
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: we_meet_session
      description: HttpOnly、Secure、SameSite=Lax 会话 cookie；不在 URL 中携带。

  parameters:
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema: { type: string, minLength: 16 }
      description: double-submit token；与 bootstrap 返回的 csrf_token 一致。
    ExpectedRevision:
      name: expected_revision
      in: query
      required: true
      schema: { type: integer, minimum: 0 }
      description: 乐观并发；与 Task.revision 不一致返回 409 version_conflict。
    Cursor:
      name: cursor
      in: query
      required: false
      schema: { type: string }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    TaskId:
      name: taskId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RunId:
      name: runId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ArtifactId:
      name: artifactId
      in: path
      required: true
      schema: { type: string, format: uuid }
    VersionNo:
      name: versionNo
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    ExportId:
      name: exportId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CredentialId:
      name: credentialId
      in: path
      required: true
      schema: { type: string, format: uuid }
    UsageFrom:
      name: from
      in: query
      required: true
      schema: { type: string, format: date }
      description: 起始自然日（含）；不得晚于 to，跨度上限 366 天。
    UsageTo:
      name: to
      in: query
      required: true
      schema: { type: string, format: date }
      description: 结束自然日（含）。

    DownloadToken:
      name: X-Download-Token
      in: header
      required: true
      description: |
        download-ticket 返回的一次性明文凭证；服务端比对 SHA-256 哈希。
        只走请求头：不进 URL、不进查询串、不写访问日志（D6 日志扫描门禁覆盖）。
      schema: { type: string, minLength: 16, maxLength: 128, pattern: "^[0-9a-f]+$" }

  responses:
    BadRequest:
      description: 请求格式或字段非法
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: 未认证或会话失效
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: 无权限或组织/席位/策略不允许
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: 资源不存在或不可见
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: revision、幂等键或状态冲突
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    UnprocessableEntity:
      description: 语义不可执行（scope、权限模式、配额等）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ServiceUnavailable:
      description: 依赖暂时不可用；可安全重试
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      additionalProperties: false
      required: [code, message, retryable, correlation_id]
      properties:
        code: { type: string }
        message: { type: string }
        retryable: { type: boolean }
        correlation_id: { type: string }
        current_revision: { type: [integer, "null"], minimum: 0 }
        recovery_action: { type: [string, "null"] }

    Org:
      type: object
      additionalProperties: false
      required: [id, name, role, work_seat]
      properties:
        id: { type: string }
        name: { type: string }
        role: { type: string, enum: [owner, admin, member, viewer] }
        work_seat: { type: boolean }

    Limits:
      type: object
      additionalProperties: false
      required: [max_goal_chars, max_background_chars, max_artifact_bytes, max_active_runs]
      properties:
        max_goal_chars: { type: integer, minimum: 1 }
        max_background_chars: { type: integer, minimum: 0 }
        max_artifact_bytes: { type: integer, minimum: 1 }
        max_active_runs: { type: integer, minimum: 1 }

    Bootstrap:
      type: object
      additionalProperties: false
      required: [subject_id, org, permissions, phases, execution_targets, allowed_permission_modes, limits, csrf_token]
      properties:
        subject_id: { type: string }
        org: { $ref: "#/components/schemas/Org" }
        permissions:
          type: array
          items: { type: string }
        phases:
          type: array
          items: { type: string, enum: [R0a] }
        execution_targets:
          type: array
          items: { $ref: "#/components/schemas/Target" }
        allowed_permission_modes:
          type: array
          items: { $ref: "#/components/schemas/PermissionMode" }
        limits: { $ref: "#/components/schemas/Limits" }
        csrf_token: { type: string, minLength: 16 }

    InputCreateRequest:
      type: object
      additionalProperties: false
      required: [client_request_id, goal]
      properties:
        client_request_id: { type: string, minLength: 8, maxLength: 128 }
        goal: { type: string, minLength: 1, maxLength: 2000 }
        background: { type: string, maxLength: 4000 }
        media_type: { type: string, enum: [text/markdown], default: text/markdown }

    InputObject:
      type: object
      additionalProperties: false
      required: [input_ref, content_hash, bytes, media_type, expires_at]
      properties:
        input_ref: { type: string, format: uuid }
        content_hash: { type: string }
        bytes: { type: integer, minimum: 1 }
        media_type: { type: string }
        expires_at: { type: string, format: date-time }

    Template:
      type: object
      additionalProperties: false
      required: [id, version, name, description, output_format, sections, content_hash]
      properties:
        id: { type: string }
        version: { type: integer, minimum: 1 }
        name: { type: string }
        description: { type: string }
        output_format: { type: string, enum: [markdown] }
        sections:
          type: array
          items: { type: string }
        content_hash: { type: string }

    TemplateList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Template" }

    TemplateSelection:
      type: object
      additionalProperties: false
      required: [id, version]
      properties:
        id: { type: string }
        version: { type: integer, minimum: 1 }

    PermissionMode:
      type: string
      enum: [ask_each, auto_readonly]

    Target:
      type: object
      additionalProperties: false
      required: [kind, profile]
      properties:
        kind: { type: string, enum: [cloud] }
        profile: { type: string, enum: [text-v1] }

    OutputSpec:
      type: object
      additionalProperties: false
      required: [format]
      properties:
        format: { type: string, enum: [markdown] }
        audience: { type: [string, "null"] }
        length: { type: [string, "null"], enum: [short, medium, long, null] }
        required_sections:
          type: array
          maxItems: 10
          items: { type: string }

    SuiteSelection:
      type: object
      additionalProperties: false
      required: [id, version]
      properties:
        id: { type: string }
        version: { type: integer, minimum: 1 }

    ConnectorSelection:
      type: object
      additionalProperties: false
      required: [connection_id, grant_id]
      properties:
        connection_id: { type: string, format: uuid }
        grant_id: { type: string, format: uuid }

    R0aIntent:
      type: object
      additionalProperties: false
      required: [input_ref, target, permission_mode, output]
      properties:
        input_ref: { type: string, format: uuid }
        target: { $ref: "#/components/schemas/Target" }
        template: { anyOf: [{ $ref: "#/components/schemas/TemplateSelection" }, { type: "null" }] }
        permission_mode: { $ref: "#/components/schemas/PermissionMode" }
        output: { $ref: "#/components/schemas/OutputSpec" }
        suite:
          anyOf: [{ $ref: "#/components/schemas/SuiteSelection" }, { type: "null" }]
          description: R0a 收到非空 suite 必须返回 422 scope_unavailable。
        connectors:
          type: array
          maxItems: 0
          items: { $ref: "#/components/schemas/ConnectorSelection" }
          description: R0a 收到非空 connectors 必须返回 422 scope_unavailable。

    TaskPreviewRequest:
      type: object
      additionalProperties: false
      required: [intent]
      properties:
        intent: { $ref: "#/components/schemas/R0aIntent" }

    TokenUpperBound:
      type: object
      additionalProperties: false
      required: [amount_tokens]
      properties:
        amount_tokens:
          type: integer
          minimum: 0
          description: 本次 Run 的 token 硬上限；派发前按该值预留，超限受控失败
        note:
          type: string
          description: 固定提示：用量仅供参考，费用以客户云厂商账单为准

    TaskPreview:
      type: object
      additionalProperties: false
      required: [preview_hash, effective_permission_mode, boundary_summary, token_upper_bound, unavailable_reasons, expires_at]
      properties:
        preview_hash: { type: string }
        effective_permission_mode: { $ref: "#/components/schemas/PermissionMode" }
        allowed_permission_modes:
          type: array
          items: { $ref: "#/components/schemas/PermissionMode" }
        boundary_summary:
          type: array
          items: { type: string }
        token_upper_bound: { $ref: "#/components/schemas/TokenUpperBound" }
        unavailable_reasons:
          type: array
          items: { type: string }
        expires_at: { type: string, format: date-time }

    TaskSubmitRequest:
      type: object
      additionalProperties: false
      required: [client_request_id, preview_hash, intent]
      properties:
        client_request_id: { type: string, minLength: 8, maxLength: 128 }
        preview_hash: { type: string }
        intent: { $ref: "#/components/schemas/R0aIntent" }

    TaskState:
      type: string
      enum: [open, awaiting_acceptance, completed, canceled, archived]
      description: canceled/archived 为 R0b 预留；R0a 没有产生这两个状态的接口，客户端按只读渲染。

    DisplayState:
      type: string
      enum:
        - open
        - queued
        - running
        - awaiting_acceptance
        - completed
        - failed
        - run_canceled
        - reconciling
        - quota_exhausted
        - canceling
        - canceled
        - archived

    RunState:
      type: string
      enum: [queued, active, waiting, cancel_requested, succeeded, failed, canceled]

    WaitReason:
      type: [string, "null"]
      enum: [quota, provider, reconcile, null]

    OperationState:
      type: string
      enum: [prepared, waiting_approval, authorized, dispatching, unknown, succeeded, failed, canceled, reconciled, unresolved]

    Run:
      type: object
      additionalProperties: false
      required: [id, task_id, attempt_no, state, control_revision, runtime_version, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        task_id: { type: string, format: uuid }
        attempt_no: { type: integer, minimum: 1 }
        state: { $ref: "#/components/schemas/RunState" }
        wait_reason: { $ref: "#/components/schemas/WaitReason" }
        terminal_reason: { type: [string, "null"] }
        control_revision: { type: integer, minimum: 0 }
        runtime_version: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    TaskSummary:
      type: object
      additionalProperties: false
      required:
        - task_id
        - title
        - display_state
        - task_state
        - permission_mode
        - revision
        - pending_acceptance
        - blocking_operations
        - quota
        - created_at
        - updated_at
      properties:
        task_id: { type: string, format: uuid }
        title: { type: string }
        display_state: { $ref: "#/components/schemas/DisplayState" }
        task_state: { $ref: "#/components/schemas/TaskState" }
        permission_mode: { $ref: "#/components/schemas/PermissionMode" }
        active_run_id: { type: [string, "null"], format: uuid }
        latest_run_id: { type: [string, "null"], format: uuid }
        latest_run: { anyOf: [{ $ref: "#/components/schemas/Run" }, { type: "null" }] }
        latest_artifact:
          anyOf:
            - type: object
              additionalProperties: false
              required: [artifact_id, version_no, content_hash]
              properties:
                artifact_id: { type: string, format: uuid }
                version_no: { type: integer, minimum: 1 }
                content_hash: { type: string }
            - type: "null"
        revision: { type: integer, minimum: 0 }
        pending_acceptance: { type: boolean }
        blocking_operations: { type: integer, minimum: 0 }
        quota:
          type: object
          additionalProperties: false
          required: [reserved_tokens, settled_tokens]
          properties:
            reserved_tokens: { type: integer, minimum: 0, description: 在途 Operation 的 token 预留合计 }
            settled_tokens: { type: integer, minimum: 0, description: 已结算 token 合计；与云厂商账单可能不同，平台不对账金额 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    TaskPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/TaskSummary" }
        next_cursor: { type: [string, "null"] }

    TaskDetail:
      type: object
      additionalProperties: false
      required: [summary, input_ref, goal, background, template]
      properties:
        summary: { $ref: "#/components/schemas/TaskSummary" }
        input_ref: { type: string, format: uuid }
        goal: { type: string }
        background: { type: [string, "null"] }
        template: { anyOf: [{ $ref: "#/components/schemas/Template" }, { type: "null" }] }
        snapshot:
          type: object
          additionalProperties: false
          required: [snapshot_id, snapshot_hash, tool_allowlist, model_route]
          properties:
            snapshot_id: { type: string, format: uuid }
            snapshot_hash: { type: string }
            tool_allowlist:
              type: array
              items: { type: string }
            model_route: { type: object, additionalProperties: true }

    TaskRun:
      type: object
      additionalProperties: false
      required: [task, run]
      properties:
        task: { $ref: "#/components/schemas/TaskSummary" }
        run: { $ref: "#/components/schemas/Run" }

    TaskUpdateRequest:
      type: object
      additionalProperties: false
      required: [client_request_id, expected_revision, title]
      properties:
        client_request_id: { type: string, minLength: 8, maxLength: 128 }
        expected_revision: { type: integer, minimum: 0 }
        title:
          type: string
          minLength: 1
          maxLength: 80
          description: 去首尾空白后 1–80 字符；禁止控制字符；敏感元数据，不写普通日志/事件 payload。

    TaskDeletion:
      type: object
      additionalProperties: false
      required: [task_id, deleted_at, content_purge]
      properties:
        task_id: { type: string, format: uuid }
        deleted_at: { type: string, format: date-time }
        content_purge:
          type: string
          enum: [scheduled]
          description: 正文/输入在 Content Store 中异步粉碎；备份按留存周期自然过期。

    TaskRunRequest:
      type: object
      additionalProperties: false
      required: [client_request_id, expected_revision, target]
      properties:
        client_request_id: { type: string, minLength: 8, maxLength: 128 }
        expected_revision: { type: integer, minimum: 0 }
        target: { $ref: "#/components/schemas/Target" }
        reason: { type: string, maxLength: 500 }

    CancelRequest:
      type: object
      additionalProperties: false
      required: [client_request_id]
      properties:
        client_request_id: { type: string, minLength: 8, maxLength: 128 }
        reason: { type: string, maxLength: 500 }

    Operation:
      type: object
      additionalProperties: false
      required: [id, run_id, logical_key, kind, state, request_hash, revision, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        run_id: { type: string, format: uuid }
        logical_key: { type: string }
        kind: { type: string, enum: [model, tool, artifact] }
        state: { $ref: "#/components/schemas/OperationState" }
        request_hash: { type: string }
        provider_request_id: { type: [string, "null"] }
        receipt_ref: { type: [string, "null"] }
        revision: { type: integer, minimum: 0 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    OperationPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Operation" }
        next_cursor: { type: [string, "null"] }

    TaskEvent:
      type: object
      additionalProperties: false
      required: [event_id, task_id, seq, schema_version, occurred_at, type, payload]
      properties:
        event_id: { type: string, format: uuid }
        task_id: { type: string, format: uuid }
        run_id: { type: [string, "null"], format: uuid }
        seq: { type: integer, minimum: 1 }
        schema_version: { type: string }
        occurred_at: { type: string, format: date-time }
        type: { type: string }
        payload:
          type: object
          additionalProperties: true

    InboxItem:
      type: object
      additionalProperties: false
      required: [task_id, type, title, display_state, updated_at]
      properties:
        task_id: { type: string, format: uuid }
        type: { type: string, enum: [acceptance_required, failed, reconciling] }
        title: { type: string }
        display_state: { $ref: "#/components/schemas/DisplayState" }
        updated_at: { type: string, format: date-time }

    InboxPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/InboxItem" }
        next_cursor: { type: [string, "null"] }

    ArtifactVersion:
      type: object
      additionalProperties: false
      required: [artifact_id, version_no, logical_name, media_type, bytes, content_hash, state, content_url, created_at]
      properties:
        artifact_id: { type: string, format: uuid }
        version_no: { type: integer, minimum: 1 }
        logical_name: { type: string }
        media_type: { type: string }
        bytes: { type: integer, minimum: 0 }
        content_hash: { type: string }
        state: { type: string, enum: [published] }
        content_url: { type: string, format: uri }
        created_at: { type: string, format: date-time }
        published_at: { type: [string, "null"], format: date-time }

    ArtifactVersionCreateRequest:
      type: object
      additionalProperties: false
      required: [client_request_id, base_version_no, content]
      properties:
        client_request_id: { type: string, minLength: 8, maxLength: 128 }
        base_version_no: { type: integer, minimum: 1 }
        logical_name: { type: string, maxLength: 200 }
        media_type: { type: string, enum: [text/markdown, text/plain], default: text/markdown }
        content: { type: string, maxLength: 262144 }

    AcceptanceByVersion:
      type: object
      additionalProperties: false
      required: [client_request_id, expected_revision, artifact_id, version_no]
      properties:
        client_request_id: { type: string, minLength: 8, maxLength: 128 }
        expected_revision: { type: integer, minimum: 0 }
        artifact_id: { type: string, format: uuid }
        version_no: { type: integer, minimum: 1 }

    AcceptanceByReason:
      type: object
      additionalProperties: false
      required: [client_request_id, expected_revision, completion_reason]
      properties:
        client_request_id: { type: string, minLength: 8, maxLength: 128 }
        expected_revision: { type: integer, minimum: 0 }
        completion_reason: { type: string, minLength: 1, maxLength: 500 }

    AcceptanceRequest:
      oneOf:
        - $ref: "#/components/schemas/AcceptanceByVersion"
        - $ref: "#/components/schemas/AcceptanceByReason"

    Acceptance:
      type: object
      additionalProperties: false
      required: [id, task_id, actor_subject_id, task_revision, created_at]
      properties:
        id: { type: string, format: uuid }
        task_id: { type: string, format: uuid }
        artifact_id: { type: [string, "null"], format: uuid }
        version_no: { type: [integer, "null"], minimum: 1 }
        completion_reason: { type: [string, "null"] }
        actor_subject_id: { type: string }
        task_revision: { type: integer, minimum: 0 }
        created_at: { type: string, format: date-time }

    AcceptanceResult:
      type: object
      additionalProperties: false
      required: [acceptance, task]
      properties:
        acceptance: { $ref: "#/components/schemas/Acceptance" }
        task: { $ref: "#/components/schemas/TaskSummary" }

    UsageRow:
      type: object
      additionalProperties: false
      required: [provider, model, usage_date, input_tokens, output_tokens, cached_input_tokens, run_count]
      properties:
        provider: { type: string, enum: [aliyun, volcengine, deepseek] }
        model: { type: string }
        usage_date: { type: string, format: date }
        input_tokens: { type: integer, minimum: 0 }
        output_tokens: { type: integer, minimum: 0 }
        cached_input_tokens: { type: integer, minimum: 0 }
        run_count: { type: integer, minimum: 0 }

    UserUsage:
      type: object
      additionalProperties: false
      required: [from, to, note, items]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        note: { type: string, description: 固定提示：仅供参考，费用以云厂商账单为准 }
        items:
          type: array
          items: { $ref: "#/components/schemas/UsageRow" }

    OrgUsageRow:
      type: object
      additionalProperties: false
      required: [provider, model, input_tokens, output_tokens, cached_input_tokens, run_count]
      properties:
        provider: { type: string, enum: [aliyun, volcengine, deepseek] }
        model: { type: string }
        input_tokens: { type: integer, minimum: 0 }
        output_tokens: { type: integer, minimum: 0 }
        cached_input_tokens: { type: integer, minimum: 0 }
        run_count: { type: integer, minimum: 0 }

    OrgUsage:
      type: object
      additionalProperties: false
      required: [from, to, note, items]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        note: { type: string }
        items:
          type: array
          items: { $ref: "#/components/schemas/OrgUsageRow" }

    ProviderCredentialView:
      type: object
      additionalProperties: false
      required: [credential_id, provider, mode, fingerprint, key_version, state, created_at]
      properties:
        credential_id: { type: string, format: uuid }
        provider: { type: string, enum: [aliyun, volcengine, deepseek] }
        mode: { type: string, enum: [sts_role, managed_key] }
        fingerprint:
          type: string
          description: 指纹（如 SHA-256 前缀）；不可逆，用于审计与人工核对
        key_version: { type: integer, minimum: 1 }
        state: { type: string, enum: [active, revoked] }
        created_at: { type: string, format: date-time }
        rotated_at: { type: [string, "null"], format: date-time }

    ProviderCredentialCreateRequest:
      type: object
      additionalProperties: false
      required: [provider, mode]
      description: api_key 只写不回读；服务端加密后只返回指纹。sts_role 只接受 role_ref。
      properties:
        provider: { type: string, enum: [aliyun, volcengine, deepseek] }
        mode: { type: string, enum: [sts_role, managed_key] }
        role_ref: { type: string, description: 角色标识（sts_role 必填） }
        api_key: { type: string, minLength: 8, writeOnly: true, description: 厂商 API Key（managed_key 必填；写后不可读） }

    ProviderCredentialRotateRequest:
      type: object
      additionalProperties: false
      required: [api_key]
      properties:
        api_key: { type: string, minLength: 8, writeOnly: true }

    ProviderConfigView:
      type: object
      additionalProperties: false
      required: [config_id, revision, provider, model, region, endpoint, credential_mode, credential, state, created_at]
      properties:
        config_id: { type: string, format: uuid }
        revision: { type: integer, minimum: 1 }
        provider: { type: string, enum: [aliyun, volcengine, deepseek] }
        model: { type: string }
        region: { type: string }
        endpoint: { type: string, format: uri }
        credential_mode: { type: string, enum: [sts_role, managed_key] }
        credential: { $ref: "#/components/schemas/ProviderCredentialView" }
        state: { type: string, enum: [active, superseded, revoked] }
        created_at: { type: string, format: date-time }

    ProviderConfigSetRequest:
      type: object
      additionalProperties: false
      required: [provider, model, region, endpoint, credential_mode, credential_id, expected_revision]
      properties:
        provider: { type: string, enum: [aliyun, volcengine, deepseek] }
        model: { type: string, minLength: 1, maxLength: 120 }
        region: { type: string, minLength: 1 }
        endpoint: { type: string, format: uri, pattern: "^https://" }
        credential_mode: { type: string, enum: [sts_role, managed_key] }
        credential_id: { type: string, format: uuid }
        expected_revision:
          type: integer
          minimum: 0
          description: 当前 active 配置的 revision；尚无配置时传 0，不一致返回 409 version_conflict

    ProviderRevokeRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 200 }

    ProviderConfigRevoked:
      type: object
      additionalProperties: false
      required: [org_id, state]
      properties:
        org_id: { type: string }
        state: { type: string, enum: [revoked] }

    ProviderCredentialRevoked:
      type: object
      additionalProperties: false
      required: [credential_id, state]
      properties:
        credential_id: { type: string, format: uuid }
        state: { type: string, enum: [revoked] }

    AdminOverview:
      type: object
      additionalProperties: false
      required: [org_id, name, status, execution_enabled, seats, quota, quota_period_id,
                 run_cap_tokens, org_revision, audit_retention_days]
      properties:
        org_id: { type: string }
        name:
          type: [string, "null"]
          description: 来自 Host IdentityDirectory 投影；目录未提供名称时为 null，前端显示占位文案
        status: { type: string, enum: [active, suspended, archived] }
        execution_enabled:
          type: boolean
          description: 组织可执行 = 目录状态 active 且未被运维停用（operator_suspended）
        seats:
          type: object
          additionalProperties: false
          required: [total, active]
          properties:
            total:
              type: integer
              minimum: 0
              description: 非 left 成员数；不受列表分页影响
            active: { type: integer, minimum: 0, description: status=active 且持有工作席位的成员数 }
        quota:
          type: object
          additionalProperties: false
          required: [enforcement, limit_tokens, reserved_tokens, settled_tokens]
          properties:
            enforcement:
              type: string
              enum: [soft, hard]
              description: soft=客户自带账号，周期量只统计；hard=演示组织等平台承担成本的组织，超限即拒
            limit_tokens: { type: integer, minimum: 0 }
            reserved_tokens: { type: integer, minimum: 0 }
            settled_tokens: { type: integer, minimum: 0 }
        quota_period_id:
          type: string
          description: 用量统计周期（YYYY-MM）；token 账本由 Work 自己持有（方案 B），P1-A 不提供
        run_cap_tokens:
          type: integer
          minimum: 1
          description: 每个 Run 的 token 硬上限；所有组织强制
        org_revision:
          type: integer
          minimum: 0
          description: 目录投影修订号；用于判断管理页数据新鲜度
        audit_retention_days: { type: integer, minimum: 1 }

    Seat:
      type: object
      additionalProperties: false
      required: [subject_id, role, work_seat, status, revision]
      properties:
        subject_id: { type: string }
        role: { type: string, enum: [owner, admin, member, viewer] }
        work_seat: { type: boolean }
        status: { type: string, enum: [invited, active, suspended, left] }
        revision: { type: integer, minimum: 0 }

    SeatPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Seat" }
        next_cursor: { type: [string, "null"] }

    AuditExportRequest:
      type: object
      additionalProperties: false
      required: [client_request_id, range_from, range_to, format]
      properties:
        client_request_id: { type: string, minLength: 8, maxLength: 128 }
        range_from:
          type: string
          format: date-time
          description: 不早于审计留存窗口起点，且必须早于 range_to；跨度上限 92 天
        range_to: { type: string, format: date-time, description: 不得晚于服务端当前时间 }
        format: { type: string, enum: [csv, json] }

    AuditExport:
      type: object
      additionalProperties: false
      required: [id, status, format, range_from, range_to, requested_by, requested_at,
                 ready_at, expires_at, row_count, bytes, error_code, download_available,
                 downloaded_at]
      description: |
        异步审计导出作业。作业元数据与状态由 Work 自己的存储持有（方案 B）；
        正文进 Content Store，库内只留引用与哈希，响应里不返回引用。
        生命周期 queued → running → ready →（到期）expired，失败为 failed。
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [queued, running, ready, expired, failed] }
        format: { type: string, enum: [csv, json] }
        range_from: { type: string, format: date-time }
        range_to: { type: string, format: date-time }
        requested_by: { type: string, description: 发起导出的管理员 subject_id }
        requested_at: { type: string, format: date-time }
        ready_at: { type: [string, "null"], format: date-time }
        expires_at: { type: [string, "null"], format: date-time }
        row_count: { type: [integer, "null"], minimum: 0 }
        bytes: { type: [integer, "null"], minimum: 0 }
        error_code:
          type: [string, "null"]
          description: 失败原因码（snake_case），不含正文；未失败为 null
        download_available:
          type: boolean
          description: 可发放一次性下载凭证（ready、未下载过、未过期）
        downloaded_at: { type: [string, "null"], format: date-time }

    AuditExportTicket:
      type: object
      additionalProperties: false
      required: [token, expires_at, format, row_count, bytes]
      description: |
        一次性下载凭证。服务端只存 SHA-256 哈希；明文 token 只在此响应出现一次，
        通过 X-Download-Token 请求头回传（不进 URL、不写访问日志），兑换一次即失效。
      properties:
        token: { type: string, minLength: 16, maxLength: 128, pattern: "^[0-9a-f]+$" }
        expires_at: { type: string, format: date-time }
        format: { type: string, enum: [csv, json] }
        row_count: { type: integer, minimum: 0 }
        bytes: { type: integer, minimum: 0 }
