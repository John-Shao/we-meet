services:
  postgres:
    image: postgres:16
    container_name: work-cloud-slice-pg
    environment:
      POSTGRES_PASSWORD: test
      POSTGRES_DB: work_slice
    ports:
      - "55436:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d work_slice"]
      interval: 2s
      timeout: 3s
      retries: 20
