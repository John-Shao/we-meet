services:
  postgres:
    image: postgres:16
    container_name: work-connector-slice-pg
    environment:
      POSTGRES_PASSWORD: test
      POSTGRES_DB: work_connector_slice
    ports:
      - "55438:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d work_connector_slice"]
      interval: 2s
      timeout: 3s
      retries: 20
