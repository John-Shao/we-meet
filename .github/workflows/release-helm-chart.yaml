name: Release Chart
run-name: Release Chart

on:
  push:
    paths:
      - src/helm/meet/**
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    strategy:
      # The publisher commits to gh-pages; keep chart jobs sequential.
      max-parallel: 1
      matrix:
        chart: [meet]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Cleanup
        run: rm -rf ./src/helm/extra

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.0
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      - name: Stage chart
        run: |
          mkdir -p ".chart-publish/${{ matrix.chart }}"
          cp -a "src/helm/${{ matrix.chart }}/." ".chart-publish/${{ matrix.chart }}/"

      - name: Publish Helm charts
        uses: numerique-gouv/helm-gh-pages@add-overwrite-option
        with:
          # The publisher expects one chart directory per parent and moves the
          # package directory once per chart; stage exactly one chart per job.
          charts_dir: ./.chart-publish
          helm_version: 3.17.0
          linting: on
          token: ${{ secrets.GITHUB_TOKEN }}
