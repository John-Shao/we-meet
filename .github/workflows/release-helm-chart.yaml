name: Release Chart
run-name: Release Chart

on:
  push:
    paths:
      - src/helm/meet/**
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    strategy:
      # The publisher commits to gh-pages; keep chart jobs sequential.
      max-parallel: 1
      matrix:
        chart: [meet, work-agent, work-agent-k8s]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Cleanup
        run: rm -rf ./src/helm/extra

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.0
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      - name: Publish Helm charts
        uses: numerique-gouv/helm-gh-pages@add-overwrite-option
        with:
          # This action moves the whole package directory on each iteration;
          # one chart per job avoids the second-iteration mv failure.
          charts_dir: ./src/helm/${{ matrix.chart }}
          helm_version: 3.17.0
          linting: on
          token: ${{ secrets.GITHUB_TOKEN }}
