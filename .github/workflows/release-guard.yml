name: Release guard

# 发布分支的护栏。
#
# meet.yml 的完整 push 流水线仅覆盖 main。发布分支在这里检查前端产物、
# AI 资料权限、流式资源释放、迁移一致性和真实 Celery 注册。
# 模型/对象存储调用使用测试替身；数据库和 Redis 使用隔离的服务容器。
on:
  push:
    branches:
      - aliyun-dev
  pull_request:
    branches:
      - aliyun-dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: meet
          POSTGRES_USER: dinum
          POSTGRES_PASSWORD: pass
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: meet.settings
      DJANGO_CONFIGURATION: Test
      DJANGO_SECRET_KEY: isolated-release-guard-test-key
      OIDC_OP_JWKS_ENDPOINT: http://localhost/unused-test-jwks
      DATABASE_URL: postgresql://dinum:pass@localhost:5432/meet
      REDIS_URL: redis://localhost:6379/14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Install locked dependencies
        run: uv sync --locked --all-extras
      - name: Check migration consistency
        run: uv run python manage.py makemigrations --check --dry-run
      - name: Check Work account admission and execution boundaries
        run: uv run pytest work/tests
      - name: Check AI access, stream cleanup and task registration
        run: >-
          uv run pytest
          core/tests/services/test_personal_ai.py
          core/tests/services/test_personal_ai_access.py
          core/tests/services/test_personal_ai_stream.py
          core/tests/test_api_users_ask_personal_ai.py
          core/tests/test_api_users_ask_personal_ai_stream.py
          core/tests/services/test_room_ai_access.py
          core/tests/services/test_meeting_collaboration.py
          core/tests/services/test_unified_meeting_search.py
          core/tests/test_api_search_ask.py
          core/tests/services/test_hybrid_retrieval.py
          core/tests/services/test_llm_client_stream.py
          core/tests/services/test_llm_client_completion.py
          core/tests/test_tasks_registration.py
          core/tests/test_task_registry.py
          core/tests/test_worker_registration.py
          core/tests/test_ai_admission.py
          core/tests/services/test_legacy_summary_runs.py
          core/tests/services/test_online_meeting_notes.py
          core/tests/tasks/test_summary.py
          core/tests/services/test_embed_task.py
          core/tests/services/test_embedding_consistency.py
          core/tests/services/test_embeddings.py
          core/tests/services/test_meeting_summary_chapters.py
          core/tests/services/test_meeting_summary_edit.py
          core/tests/services/test_meeting_summary_doc_push.py
          core/tests/services/test_meeting_summary_im_push.py

  deployment-boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install Helm
        uses: azure/setup-helm@v4.3.1
        with:
          version: v3.17.3
      - name: Install render and agent certificate test dependencies
        run: python -m pip install PyYAML==6.0.2 cryptography==46.0.7
      - name: Check manifests and release gates without cluster access
        run: >-
          python -m unittest discover -s deploy/aliyun -p 'test_*ci.py' -v
      - name: Check AI workload chart and release script
        run: python -m unittest discover -s deploy/aliyun -p test_meeting_ai_chart.py -v
      - name: Check HTTP AI pool isolation
        run: python -m unittest discover -s deploy/aliyun -p test_ai_pool.py -v
      - name: Check account cohort production update fences
        run: python -m unittest discover -s deploy/aliyun -p test_work_account_cohort.py -v
      - name: Check isolated Pi account wiring
        run: python -m unittest discover -s deploy/aliyun -p test_work_cohort_review.py -v
      - name: Check independent gateway update scope
        run: python -m unittest discover -s deploy/aliyun -p test_work_gateway_update.py -v
      - name: Check agent budget and local lifecycle contracts without model calls
        working-directory: src/work-agent
        run: python -m unittest discover -s tests -v
      - name: Check offsite backup and restore safety boundaries
        run: python -m unittest discover -s deploy/backup -p 'test_*.py' -v

  desktop-boundaries:
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: src/desktop
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/desktop/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: npm ci --no-audit --no-fund
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - run: npm test

  frontend-artifact:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # 语言包是手改的(还会被 Crowdin 整份覆盖),一个逗号就能让 vite build 挂掉。
      # 单独一步是为了让红叉直接指出原因;`npm test` 里也会再跑一次(50ms 的事)。
      - name: Check that every JSON under src/ parses
        run: npm run check:json

      - name: Run frontend unit tests
        run: npm test

      # 真正的产物门,也是这条护栏存在的理由:`tsc -b && vite build`。
      # 单元测试**不做类型检查**,所以「测试全绿、镜像构建不出来」是真实存在的一类
      # 失败 —— 前端镜像就曾因此完全构建不出来。
      - name: Build the frontend bundle
        run: npm run build
