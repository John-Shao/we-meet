name: Work device gates

on:
  pull_request:
    paths:
      - 'src/device/**'
      - 'src/work/node/**'
      - 'docs/plan/assets/harness-lab/**'
      - '.github/workflows/work-device.yml'
  push:
    branches:
      - aliyun-dev
    paths:
      - 'src/device/**'
      - 'src/work/node/**'
      - 'docs/plan/assets/harness-lab/**'
      - '.github/workflows/work-device.yml'

permissions:
  contents: read

jobs:
  device-rust:
    name: Device crate fmt, clippy and test (Windows CNG)
    # The CNG device-key tests are Windows-only, so this job must run on Windows.
    # The crate is target-agnostic (windows-rs links both MSVC and GNU); CI uses
    # the runner's default MSVC host. rust-toolchain.toml pins stable + the GNU
    # target + rustfmt/clippy, which rustup installs on first use.
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src/device
    steps:
      - uses: actions/checkout@v6
      - name: Verify the pinned device bundle manifest
        working-directory: src/work/node/device-bundle
        run: |
          node build-manifest.mjs
          git diff --exit-code -- bundle-manifest.json dev-fixture-profile.json
      - name: Install the pinned toolchain
        run: rustup show
      - name: Format check
        run: cargo fmt --check
      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings
      - name: Test (includes non-exportable CNG key tests)
        run: cargo test
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install pinned Node runtime dependencies
        working-directory: src/work/node
        run: npm ci
      - name: Test Node device bundle
        working-directory: src/work/node/device-bundle
        run: npm test

  h02-runtime:
    name: H02 Supervisor and Node runtime regression
    runs-on: windows-latest
    defaults:
      run:
        working-directory: docs/plan/assets/harness-lab
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned YAML parser for fixture secret loading
        run: python -m pip install PyYAML==6.0.3
      - name: Install pinned Node runtime dependencies
        working-directory: src/work/node
        run: npm ci
      - name: Install pinned harness dependencies
        run: npm ci
      - name: Test H02 supervisor against isolated provider fixture
        run: npm run test:h02-supervisor
